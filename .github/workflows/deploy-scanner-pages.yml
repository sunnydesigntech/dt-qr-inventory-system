name: Deploy scanner page

on:
  push:
    branches:
      - main
      - codex/sanitized-public-release
    paths:
      - scanner/**
      - .github/workflows/deploy-scanner-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload scanner artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: scanner
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
