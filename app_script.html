<script>
(function () {
  'use strict';

  var BOOT = window.__BOOTSTRAP__ || {};
  var root = document.getElementById('root');
  var appData = BOOT.appData || emptyAppData();
  var diagnostics = BOOT.diagnostics || {};
  var route = initialRoute();
  var DEFAULT_EXTERNAL_SCANNER_URL = 'https://sunnydesigntech.github.io/dt-qr-inventory-system/scanner/';
  var UPDATE_AUTH_STORAGE_KEY = 'dtInventoryUpdateAuthToken';
  var updateAuthToken = readSessionValue(UPDATE_AUTH_STORAGE_KEY);
  var localItems = [];
  var saveState = 'idle';
  var saveError = '';
  var saveMessage = '';
  var addFormOpen = false;
  var toolsOpen = false;
  var scannerEvidenceMessage = '';
  var scannerState = {
    open: false,
    status: 'idle',
    error: '',
    message: '',
    manual: '',
    manualRoom: '',
    manualLoc: '',
    suggestions: [],
    diagnostics: null,
    permissionState: '',
    lastCameraError: '',
    imageDecodeMessage: '',
    stream: null,
    raf: 0,
    starting: false,
    detector: null,
    cameraRequested: false,
    standaloneUrl: ''
  };

  function emptyAppData() {
    return {
      metrics: {
        totalRooms: 0,
        totalLocations: 0,
        totalItems: 0,
        totalChemicals: 0,
        totalAttention: 0
      },
      rooms: [],
      locations: [],
      items: {},
      readiness: {
        score: 0,
        errors: 0,
        warnings: 0,
        missingQr: 0,
        missingStorageId: 0,
        invalidQty: 0,
        invalidStatus: 0,
        duplicates: 0,
        validationLoaded: false,
        issueSample: [],
        rollout419A: { ready: 0, total: 0, pct: 0, itemCount: 0, chemicalCount: 0 }
      },
      audit: []
    };
  }

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function textValue(value) {
    return String(value == null ? '' : value).trim();
  }

  function readSessionValue(key) {
    try {
      return window.sessionStorage ? textValue(window.sessionStorage.getItem(key)) : '';
    } catch (err) {
      return '';
    }
  }

  function writeSessionValue(key, value) {
    try {
      if (!window.sessionStorage) return;
      if (value) window.sessionStorage.setItem(key, value);
      else window.sessionStorage.removeItem(key);
    } catch (err) {}
  }

  function updateAuthState() {
    return BOOT.updateAuth || {};
  }

  function isUpdateUnlocked() {
    var auth = updateAuthState();
    if (!auth.configured) return false;
    return !!(auth.authDisabled || auth.activeUserAllowed || updateAuthToken);
  }

  function updateAuthPayload() {
    return updateAuthToken ? { updateAuthToken: updateAuthToken } : {};
  }

  function safeExternalUrl(value) {
    var raw = textValue(value);
    if (!raw || !/^https?:\/\//i.test(raw)) return '';
    try {
      var parsed = new URL(raw);
      return parsed.protocol === 'http:' || parsed.protocol === 'https:' ? parsed.href : '';
    } catch (err) {
      return '';
    }
  }

  function configuredExternalScannerUrl() {
    var raw = textValue(BOOT.externalScannerUrl) || DEFAULT_EXTERNAL_SCANNER_URL;
    if (!raw || !/^https?:\/\//i.test(raw)) return '';
    try {
      var parsed = new URL(raw);
      return parsed.protocol === 'http:' || parsed.protocol === 'https:' ? parsed.href : '';
    } catch (err) {
      return '';
    }
  }

  function hasUrlScheme(value) {
    return /^[a-z][a-z0-9+.-]*:/i.test(textValue(value));
  }

  function routeUrlKey(url) {
    if (!url) return '';
    return (url.protocol + '//' + url.host + url.pathname).replace(/\/+$/, '').toLowerCase();
  }

  function configuredWebAppUrlKey() {
    try {
      var base = textValue(BOOT.webAppBaseUrl);
      return base ? routeUrlKey(new URL(base)) : '';
    } catch (err) {
      return '';
    }
  }

  function currentUrlKey() {
    try {
      return routeUrlKey(new URL(window.location.href));
    } catch (err) {
      return '';
    }
  }

  function isFramedApp() {
    try {
      return window.self !== window.top;
    } catch (err) {
      return true;
    }
  }

  function shouldAutoOpenScanner() {
    try {
      var params = new URL(window.location.href).searchParams;
      return params.get('scanner') === '1' || params.get('scan') === '1';
    } catch (err) {
      return false;
    }
  }

  function standaloneScannerUrl() {
    var external = configuredExternalScannerUrl();
    if (external) {
      try {
        var scannerUrl = new URL(external);
        var target = scannerTargetUrl();
        if (target) scannerUrl.searchParams.set('target', target);
        scannerUrl.searchParams.set('source', 'apps-script');
        return scannerUrl.toString();
      } catch (externalErr) {}
    }
    try {
      var url = new URL(window.location.href);
      ['room', 'loc', 'mode', 'admin', 'printer', 'label'].forEach(function (key) {
        url.searchParams.delete(key);
      });
      url.searchParams.set('scanner', '1');
      url.searchParams.set('topscanner', '1');
      return url.toString();
    } catch (err) {
      try {
        var fallback = new URL(textValue(BOOT.webAppBaseUrl) || window.location.href);
        fallback.searchParams.set('scanner', '1');
        fallback.searchParams.set('topscanner', '1');
        return fallback.toString();
      } catch (innerErr) {
        return '';
      }
    }
  }

  function scannerTargetUrl() {
    return scannerTargetCandidate(BOOT.webAppBaseUrl) ||
      scannerTargetCandidate(window.location.href) ||
      scannerTargetCandidate(document.referrer) ||
      '';
  }

  function scannerTargetCandidate(value) {
    var raw = textValue(value);
    if (!raw) return '';
    try {
      var url = new URL(raw);
      if (url.protocol !== 'http:' && url.protocol !== 'https:') return '';
      var host = url.hostname.toLowerCase();
      var path = url.pathname || '';
      if (host.indexOf('googleusercontent.com') !== -1 || host === 'accounts.google.com' || host === 'www.google.com') {
        return '';
      }
      if (host === 'script.google.com' && path.indexOf('/macros/') === -1) return '';
      ['room', 'loc', 'mode', 'admin', 'printer', 'scanner', 'scan', 'topscanner', 'label'].forEach(function (key) {
        url.searchParams.delete(key);
      });
      return url.toString();
    } catch (err) {
      return '';
    }
  }

  function scannerSelfTestUrl() {
    var external = configuredExternalScannerUrl();
    var target = scannerTargetUrl();
    if (!external || !target) return '';
    try {
      var url = new URL(external);
      url.searchParams.set('target', target);
      url.searchParams.set('source', 'apps-script');
      url.searchParams.set('selftest', '1');
      return url.toString();
    } catch (err) {
      return '';
    }
  }

  function openStandaloneScanner(options) {
    var opts = options || {};
    var url = standaloneScannerUrl();
    scannerState.standaloneUrl = url;
    if (!url) {
      scannerState.error = 'Could not create the full-screen scanner link. Use the phone Camera app or enter Location Code manually.';
      updateScannerStatus();
      return false;
    }
    if (opts.sameTab) {
      try {
        window.location.assign(url);
      } catch (err) {
        window.location.href = url;
      }
      return true;
    }
    var opened = null;
    try {
      opened = window.open(url, '_blank');
      if (opened) {
        try { opened.opener = null; } catch (err) {}
      }
    } catch (err) {
      opened = null;
    }
    if (opened) {
      scannerState.error = '';
      scannerState.message = 'Full-screen scanner opened. In the new tab, tap Start camera and allow camera permission.';
      updateScannerStatus();
      return true;
    } else {
      scannerState.error = 'Popup blocked. Open this full-screen scanner link manually: ' + url;
      updateScannerStatus();
      render();
      return false;
    }
  }

  function isAllowedInventoryUrl(url) {
    if (!url || (url.protocol !== 'http:' && url.protocol !== 'https:')) return false;
    var key = routeUrlKey(url);
    var configured = configuredWebAppUrlKey();
    var current = currentUrlKey();
    if (configured && key === configured) return true;
    if (current && key === current) return true;
    return false;
  }

  function stripUnsafeMode(params) {
    return {
      room: textValue(params && params.get('room')),
      loc: textValue(params && params.get('loc')),
      modeStripped: !!(params && params.get('mode'))
    };
  }

  function icon(name, size, cls) {
    var s = 'width="' + (size || 18) + '" height="' + (size || 18) + '" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="' + esc(cls || '') + '"';
    var path = '';
    switch (name) {
      case 'search': path = '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>'; break;
      case 'edit': path = '<path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>'; break;
      case 'warn': path = '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0ZM12 9v4M12 17h.01"/>'; break;
      case 'hazard': path = '<path d="M12 3 22 20H2Z"/><path d="M12 10v4M12 18h.01"/>'; break;
      case 'arrow-left': path = '<path d="M19 12H5M12 19l-7-7 7-7"/>'; break;
      case 'plus': path = '<path d="M12 5v14M5 12h14"/>'; break;
      case 'minus': path = '<path d="M5 12h14"/>'; break;
      case 'box': path = '<path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>'; break;
      case 'flask': path = '<path d="M9 3h6M10 3v6.5L4 19a2 2 0 0 0 1.7 3h12.6A2 2 0 0 0 20 19l-6-9.5V3"/>'; break;
      case 'wrench': path = '<path d="M14.7 6.3a4 4 0 1 0 4.99 4.99l-2.4-2.4 2.4-2.4-2.6-2.6-2.4 2.4ZM4 20l9-9"/>'; break;
      case 'cpu': path = '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>'; break;
      case 'printer': path = '<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>'; break;
      case 'shield': path = '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>'; break;
      case 'grid': path = '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'; break;
      case 'list': path = '<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>'; break;
      case 'building': path = '<path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h7v18M14 8h3a2 2 0 0 1 2 2v11M8 7h2M8 11h2M8 15h2"/>'; break;
      case 'scan': path = '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/>'; break;
      case 'external': path = '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/>'; break;
      case 'save': path = '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/>'; break;
      case 'info': path = '<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/>'; break;
      default: path = '<path d="M5 12h14M12 5l7 7-7 7"/>';
    }
    return '<svg ' + s + ' viewBox="0 0 24 24">' + path + '</svg>';
  }

  function scannerActionHtml(classes, innerHtml, title) {
    var href = configuredExternalScannerUrl() ? standaloneScannerUrl() : '';
    var safeTitle = title || 'Scan QR';
    if (href) {
      return '<a href="' + esc(href) + '" target="_top" rel="noopener noreferrer" data-scanner-link="external" class="' + classes + '" title="' + esc(safeTitle) + '">' + innerHtml + '</a>';
    }
    return '<button data-action="open-scanner" class="' + classes + '" title="' + esc(safeTitle) + '">' + innerHtml + '</button>';
  }

  function statusPill(status) {
    var key = String(status || 'Good');
    var cfg = {
      'Good': ['pill-good', 'dot-good'],
      'Low Stock': ['pill-low', 'dot-low'],
      'Missing': ['pill-miss', 'dot-miss'],
      'Needs Maintenance': ['pill-maint', 'dot-maint']
    }[key] || ['pill-neutral', 'dot-good'];
    return '<span class="pill ' + cfg[0] + '"><span class="dot ' + cfg[1] + '"></span>' + esc(key) + '</span>';
  }

  function hazardPill() {
    return '<span class="pill pill-hazard">' + icon('hazard', 12) + 'Chemical</span>';
  }

  function routeIdentity(loc) {
    if (!loc) return '';
    return loc.routeLoc || loc.id || loc.code || loc.storageId || loc.specific || loc.label || '';
  }

  function secondaryIdentity(loc) {
    if (!loc) return '';
    var primary = routeIdentity(loc);
    var parts = [];
    if (loc.code && loc.code !== primary) parts.push('Location Code ' + loc.code);
    if (loc.storageId && loc.storageId !== primary) parts.push('Workbook Storage ID ' + loc.storageId);
    if (loc.storageLabel && loc.storageLabel !== loc.label) parts.push(loc.storageLabel);
    return parts.join(' · ');
  }

  function routeIdentityLabel(loc) {
    var routeId = routeIdentity(loc);
    var is419ALocationCode = loc && loc.room === '419A' && /^419A-[A-Z0-9]+(?:-[A-Z0-9]+)*$/i.test(routeId);
    return is419ALocationCode ? 'Location Code' : 'Storage route';
  }

  function metric(label, value, sub, tone) {
    var iconName = {
      '419A rollout': 'shield',
      Rooms: 'grid',
      Storages: 'box',
      Items: 'list',
      Chemicals: 'flask',
      Attention: 'warn'
    }[label] || 'box';
    var toneClass = tone === 'rollout' ? 'metric-rollout' : '';
    var iconClass = tone === 'rollout' ? 'metric-icon is-rollout' :
      (label === 'Attention' ? 'metric-icon is-warning' :
      (label === 'Chemicals' ? 'metric-icon is-hazard' : 'metric-icon'));
    return '<div class="card-flat metric-card rounded-2xl ' + toneClass + '">' +
      '<div class="' + iconClass + '">' + icon(iconName, 17) + '</div>' +
      '<div class="min-w-0">' +
      '<div class="text-[10.5px] font-semibold uppercase tracking-[0.16em] metric-label">' + esc(label) + '</div>' +
      '<div class="mt-1 text-[22px] font-semibold leading-none font-display metric-value">' + esc(value) + '</div>' +
      (sub ? '<div class="mt-1 text-[11px] text-slate-500 metric-sub">' + esc(sub) + '</div>' : '') +
      '</div></div>';
  }

  function initialRoute() {
    if (BOOT.error) return { name: 'error', kind: 'generic', message: BOOT.error };
    if (BOOT.route && BOOT.route.name === 'error') {
      return { name: 'error', kind: BOOT.route.kind || 'generic', message: BOOT.route.message || '' };
    }
    if (BOOT.route && BOOT.route.name === 'labels') {
      return { name: 'labels' };
    }
    if (BOOT.route && BOOT.route.name === 'storage') return { name: 'storage' };
    if (BOOT.route && BOOT.route.name === 'audit') return { name: 'audit' };
    if (BOOT.route && BOOT.route.name === 'lowstock') return { name: 'lowstock' };
    if (BOOT.route && BOOT.route.name === 'maintenance') return { name: 'maintenance' };
    if (BOOT.route && BOOT.route.name === 'admin') {
      return { name: 'admin', admin: BOOT.route.admin || 'readiness' };
    }
    if (BOOT.route && BOOT.route.name === 'location' && BOOT.route.locKey) {
      var loc = findLocationByKey(BOOT.route.locKey);
      if (loc) return { name: 'location', loc: loc, mode: BOOT.route.mode === 'tech' ? 'tech' : 'view' };
      return { name: 'error', kind: 'no-match', message: 'No matching storage location was found.' };
    }
    return { name: 'landing', room: 'All', q: '' };
  }

  function findLocationByKey(key) {
    return (appData.locations || []).filter(function (loc) { return loc.key === key; })[0] || null;
  }

  function updateUrl(params) {
    var url = new URL(window.location.href);
    ['room', 'loc', 'mode', 'admin', 'printer', 'scanner', 'scan', 'topscanner'].forEach(function (key) { url.searchParams.delete(key); });
    Object.keys(params || {}).forEach(function (key) {
      if (params[key]) url.searchParams.set(key, params[key]);
    });
    window.history.replaceState({}, '', url.toString());
  }

  function setRoute(next) {
    stopScanner();
    scannerState.open = false;
    route = next;
    saveState = 'idle';
    saveError = '';
    saveMessage = '';
    addFormOpen = false;
    render();
  }

  function goLanding() {
    updateUrl({});
    setRoute({ name: 'landing', room: 'All', q: '' });
  }

  function goLocation(loc, mode) {
    updateUrl({ room: loc.room, loc: loc.routeLoc || loc.id, mode: mode === 'tech' ? 'tech' : '' });
    setRoute({ name: 'location', loc: loc, mode: mode === 'tech' ? 'tech' : 'view' });
  }

  function labelPrintPreset() {
    var raw = '';
    try {
      raw = new URL(window.location.href).searchParams.get('printer') || '';
    } catch (err) {
      raw = '';
    }
    raw = String(raw || '').toLowerCase();
    if (raw === 'brother-ql1110' || raw === 'brother' || raw === 'ql1110' || raw === 'brother-102x70') return 'brother-102x70';
    if (raw === 'brother-102x50' || raw === '102x50') return 'brother-102x50';
    if (raw === 'brother-90x29' || raw === '90x29' || raw === '90mmx29mm') return 'brother-90x29';
    return 'standard';
  }

  function labelPrintPresetConfig(preset) {
    if (preset === 'brother-90x29') {
      return {
        id: preset,
        title: 'Brother QL slim labels',
        description: '90mm x 29mm slim thermal label preset using a safe inset printable area so the QR and text fit. Best for short normal-storage labels, not chemical hazard labels.',
        sheetClass: 'is-brother is-brother-slim',
        printSize: '90mm x 29mm',
        pageSize: '90mm 29mm',
        printWidth: '90mm',
        printHeight: '29mm',
        printBoxWidth: '76mm',
        printBoxHeight: '22mm',
        printBoxMargin: '3.5mm 7mm',
        density: 'Slim thermal roll'
      };
    }
    if (preset === 'brother-102x50') {
      return {
        id: preset,
        title: 'Brother QL-1110 compact labels',
        description: '102mm x 50mm continuous thermal label preset. Best for normal cupboards, trays, trolleys, and storage points with short labels.',
        sheetClass: 'is-brother is-brother-compact',
        printSize: '102mm x 50mm',
        pageSize: '102mm 50mm',
        printWidth: '102mm',
        printHeight: '50mm',
        printBoxWidth: '102mm',
        printBoxHeight: '50mm',
        printBoxMargin: '0',
        density: 'Compact thermal roll'
      };
    }
    if (preset === 'brother-102x70') {
      return {
        id: preset,
        title: 'Brother QL-1110 safety labels',
        description: '102mm x 70mm continuous thermal label preset. Recommended for mixed batches and chemical labels because hazard text has enough space.',
        sheetClass: 'is-brother is-brother-safety',
        printSize: '102mm x 70mm',
        pageSize: '102mm 70mm',
        printWidth: '102mm',
        printHeight: '70mm',
        printBoxWidth: '102mm',
        printBoxHeight: '70mm',
        printBoxMargin: '0',
        density: 'Safety thermal roll'
      };
    }
    return {
      id: 'standard',
      title: 'A4 print preview',
      description: 'A4, two-column preview for ordinary office printing or PDF export.',
      sheetClass: 'is-standard',
      printSize: 'A4',
      pageSize: 'A4',
      printWidth: '210mm',
      printHeight: '297mm',
      density: 'A4 sheets'
    };
  }

  function labelPrintTarget() {
    try {
      return new URL(window.location.href).searchParams.get('label') || '';
    } catch (err) {
      return '';
    }
  }

  function labelTargetValues(loc) {
    if (!loc) return [];
    return [
      loc.key,
      routeIdentity(loc),
      loc.routeLoc,
      loc.id,
      loc.code,
      loc.storageId,
      loc.storageLabel,
      loc.label,
      loc.specific
    ].filter(Boolean).map(String);
  }

  function labelTargetMatches(loc, target) {
    var needle = String(target || '').toLowerCase();
    if (!needle) return false;
    return labelTargetValues(loc).some(function (value) {
      return value.toLowerCase() === needle;
    });
  }

  function setLabelPrintPreset(preset) {
    var url = new URL(window.location.href);
    url.searchParams.set('admin', 'labels');
    ['room', 'loc', 'mode'].forEach(function (key) { url.searchParams.delete(key); });
    if (!preset || preset === 'standard') url.searchParams.delete('printer');
    else if (preset === 'brother-102x70') url.searchParams.set('printer', 'brother-ql1110');
    else url.searchParams.set('printer', preset);
    window.history.replaceState({}, '', url.toString());
    setRoute({ name: 'labels' });
  }

  function setLabelPrintTarget(labelKey, autoPrint) {
    var url = new URL(window.location.href);
    url.searchParams.set('admin', 'labels');
    ['room', 'loc', 'mode'].forEach(function (key) { url.searchParams.delete(key); });
    if (labelKey) url.searchParams.set('label', labelKey);
    else url.searchParams.delete('label');
    window.history.replaceState({}, '', url.toString());
    setRoute({ name: 'labels' });
    if (autoPrint) {
      window.setTimeout(function () { window.print(); }, 120);
    }
  }

  function applyDynamicPrintPreset(preset) {
    var cfg = labelPrintPresetConfig(preset);
    var style = document.getElementById('dynamicPrintPreset');
    if (!style) {
      style = document.createElement('style');
      style.id = 'dynamicPrintPreset';
      document.head.appendChild(style);
    }
    var labelWidth = cfg.printWidth || '102mm';
    var labelHeight = cfg.printHeight || (preset === 'brother-102x50' ? '50mm' : '70mm');
    var printBoxWidth = cfg.printBoxWidth || labelWidth;
    var printBoxHeight = cfg.printBoxHeight || labelHeight;
    var printBoxMargin = cfg.printBoxMargin || '0';
    if (preset === 'standard') {
      style.textContent = '@media print { @page { size: A4 portrait; margin: 10mm; } .qr-label:last-child{page-break-after:auto!important;break-after:auto!important;} }';
      return cfg;
    }
    style.textContent =
      '@media print {' +
      '@page { size: ' + cfg.pageSize + '; margin: 0; }' +
      'body,html{width:' + labelWidth + ';min-width:' + labelWidth + ';height:auto!important;min-height:0!important;margin:0!important;padding:0!important;background:#fff!important;}' +
      '.app-shell{width:' + labelWidth + '!important;max-width:' + labelWidth + '!important;min-height:0!important;margin:0!important;padding:0!important;box-shadow:none!important;overflow:visible!important;}' +
      '.topbar,.label-print-controls,.label-printer-notes,.label-mode-tabs,.label-single-actions{display:none!important;}' +
      '.label-sheet{display:block!important;width:' + labelWidth + '!important;min-width:' + labelWidth + '!important;min-height:0!important;margin:0!important;border:0!important;box-shadow:none!important;padding:0!important;background:#fff!important;}' +
      '.label-preview-item{display:block!important;width:' + labelWidth + '!important;margin:0!important;padding:0!important;break-inside:avoid!important;page-break-inside:avoid!important;}' +
      '.qr-label{box-sizing:border-box!important;width:' + printBoxWidth + '!important;min-height:' + printBoxHeight + '!important;height:' + printBoxHeight + '!important;margin:' + printBoxMargin + '!important;padding:1.2mm 1.6mm!important;border:0!important;border-radius:0!important;box-shadow:none!important;page-break-before:auto!important;page-break-after:auto!important;break-before:auto!important;break-after:auto!important;}' +
      '.label-sheet.is-brother-slim .qr-label{padding:.9mm 1.1mm!important;}' +
      '}';
    return cfg;
  }

  function toggleMode() {
    if (!route.loc) return;
    var nextMode = route.mode === 'tech' ? 'view' : 'tech';
    updateUrl({ room: route.loc.room, loc: route.loc.routeLoc || route.loc.id, mode: nextMode === 'tech' ? 'tech' : '' });
    setRoute({ name: 'location', loc: route.loc, mode: nextMode });
  }

  function render() {
    if (!root) return;
    if (route.name !== 'labels') {
      var printStyle = document.getElementById('dynamicPrintPreset');
      if (printStyle) printStyle.textContent = '';
    }
    var content = '';
    var wide = false;
    if (route.name === 'error') content = renderError();
    else if (route.name === 'admin') { content = renderAdmin(); wide = true; }
    else if (route.name === 'labels') { content = renderLabels(); wide = true; }
    else if (route.name === 'storage') { content = renderStorageMaster(); wide = true; }
    else if (route.name === 'audit') { content = renderAuditLog(); wide = true; }
    else if (route.name === 'lowstock') { content = renderLowStock(); wide = true; }
    else if (route.name === 'maintenance') { content = renderMaintenance(); wide = true; }
    else if (route.name === 'location') content = renderLocation();
    else { content = renderLanding(); wide = true; }
    root.innerHTML = shell(content, wide) + (scannerState.open ? renderScannerOverlay() : '');
    bindCurrentRoute();
  }

  function shell(content, wide) {
    return '<div class="app-shell' + (wide ? ' wide' : '') + '">' + content + '</div>';
  }

  function renderLanding() {
    var q = (route.q || '').toLowerCase();
    var selectedRoom = route.room || 'All';
    var rooms = appData.rooms || [];
    var locations = (appData.locations || []).filter(function (loc) {
      if (selectedRoom !== 'All' && loc.room !== selectedRoom) return false;
      if (!q) return true;
      return [
        loc.searchText, loc.id, loc.label, loc.specific, loc.code, loc.room, loc.storageId, loc.storageLabel
      ].filter(Boolean).join(' ').toLowerCase().indexOf(q) !== -1;
    });

    var totals = appData.metrics || {
      totalRooms: rooms.length,
      totalLocations: (appData.locations || []).length,
      totalItems: rooms.reduce(function (sum, room) { return sum + (Number(room.itemCount) || 0); }, 0),
      totalChemicals: rooms.reduce(function (sum, room) { return sum + (Number(room.chemicalCount) || 0); }, 0),
      totalAttention: rooms.reduce(function (sum, room) { return sum + (Number(room.attentionCount || room.attention) || 0); }, 0)
    };
    var r = (appData.readiness && appData.readiness.rollout419A) || { pct: 0, ready: 0, total: 0 };
    var warningCount = Number((appData.readiness || {}).warnings || 0);
    var html = '';
    html += '<div class="mobile-app-header bg-white border-b border-slate-200 px-4 pt-4 pb-3">';
    html += '<div class="flex items-center justify-between"><div>';
    html += '<div class="text-[10.5px] font-semibold uppercase tracking-[0.2em] text-blue-700">Victoria Shanghai Academy</div>';
    html += '<h1 class="font-display text-[19px] font-semibold text-slate-900 mt-0.5">D&amp;T QR Inventory</h1>';
    html += '</div><div class="flex items-center gap-1.5">';
    html += scannerActionHtml('tap rounded-lg bg-blue-600 text-white flex items-center justify-center', icon('scan', 20), 'Scan QR');
    html += '<button data-action="labels" class="tap rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-600" title="QR Labels">' + icon('printer', 20) + '</button>';
    html += '<button data-action="admin" class="tap rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-600" title="Admin readiness">' + icon('shield', 20) + '</button>';
    html += '</div></div></div>';

    if (!BOOT.webAppBaseUrl) {
      html += '<div class="mx-4 mt-3 rounded-xl bg-amber-50 border border-amber-200 px-3 py-2.5 text-[12.5px] text-amber-900 flex gap-2">' +
        icon('warn', 16, 'shrink-0 mt-0.5') +
        '<div><div class="font-semibold">WEB_APP_BASE_URL is not configured</div><div class="text-amber-800/90 mt-0.5">Browsing works, but QR generation and external printed links are disabled.</div></div></div>';
    }

    html += '<div class="mobile-scan-panel mx-3 mt-3">' +
      scannerActionHtml('scan-primary-btn', icon('scan', 22) + '<span><strong>Scan QR</strong><small>Open a storage label</small></span>', 'Scan QR') +
      '<button data-action="focus-search" class="scan-secondary-btn">' + icon('search', 18) + '<span>Search storage</span></button>' +
      '<div class="mobile-scan-help">Scan a storage label or search by Location Code, room, cupboard, or trolley.</div>' +
      '</div>';

    html += '<div class="desktop-only px-4 pt-3"><div class="desktop-hero-grid">' +
      '<div class="route-principle">' +
      '<div class="route-principle-icon">' + icon('scan', 18) + '</div>' +
      '<div class="min-w-0"><div class="font-display text-[15px] font-semibold text-slate-900">One web app URL, many storage routes</div>' +
      '<div class="text-[12px] text-slate-600 mt-0.5">Printed QR labels open View Mode first. Authorised staff enter Update inside the app after checking the storage.</div>' +
      '<div class="route-example">/exec?room=419A&amp;loc=419A-FCU-01</div></div>' +
      '</div>' +
      '<div class="quick-action-card">' +
      '<div><div class="text-[10.5px] font-semibold uppercase tracking-[0.16em] text-blue-700">Workshop command</div>' +
      '<div class="font-display text-[15px] font-semibold text-slate-900 mt-1">Scan, verify, update, audit</div></div>' +
      '<div class="quick-action-grid">' +
      scannerActionHtml('quick-action-btn', icon('scan', 15) + '<span>Scan QR</span>', 'Scan QR') +
      '<button data-action="storage" class="quick-action-btn">' + icon('grid', 15) + '<span>Storage Master</span></button>' +
      '<button data-action="labels" class="quick-action-btn">' + icon('printer', 15) + '<span>QR Labels</span></button>' +
      '<button data-action="admin" class="quick-action-btn">' + icon('shield', 15) + '<span>Readiness</span></button>' +
      '</div></div>' +
      '</div></div>';

    html += '<div class="desktop-only px-4 pt-4 space-y-2">';
    html += metric('419A rollout', r.pct + '%', r.ready + '/' + r.total + ' storages QR-ready', 'rollout');
    html += '<div class="grid grid-cols-2 md:grid-cols-5 gap-2">' +
      metric('Rooms', totals.totalRooms) +
      metric('Storages', totals.totalLocations) +
      metric('Items', totals.totalItems) +
      metric('Chemicals', totals.totalChemicals) +
      metric('Attention', totals.totalAttention) +
      '</div>';
    html += '</div>';

    html += '<div class="mobile-search-wrap px-3 md:px-4 pt-3"><div class="relative">' + icon('search', 16, 'absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400') +
      '<input id="landingSearch" value="' + esc(route.q || '') + '" class="input pl-10" placeholder="Search Location Code, room, cupboard..."/></div></div>';

    html += renderRoomChips(rooms, selectedRoom);

    html += '<div class="mobile-summary-strip mx-3 mt-3">' +
      '<div><strong>' + esc(r.ready) + '/' + esc(r.total) + '</strong><span>419A QR-ready</span></div>' +
      '<div><strong>' + esc(warningCount) + '</strong><span>warnings</span></div>' +
      '<div><strong>' + esc(totals.totalAttention || 0) + '</strong><span>attention</span></div>' +
      '</div>';

    html += renderStorageSections(rooms, locations);
    html += renderOperationsTiles();
    return html;
  }

  function renderRoomChips(rooms, selectedRoom) {
    var html = '<div class="room-chip-row px-3 md:px-4 pt-3 pb-1 flex gap-2 overflow-x-auto no-scrollbar">';
    html += '<button data-room-tab="All" class="room-tab ' + (selectedRoom === 'All' ? 'is-active' : '') + '">All rooms</button>';
    rooms.forEach(function (room) {
      html += '<button data-room-tab="' + esc(room.code) + '" class="room-tab ' + (room.rollout ? 'rollout ' : '') + (selectedRoom === room.code ? 'is-active' : '') + '">' + esc(room.code) + (room.rollout ? '<span class="desktop-chip-text"> - 419A rollout</span>' : '') + '</button>';
    });
    html += '</div>';
    return html;
  }

  function renderStorageSections(rooms, locations) {
    var html = '<div class="storage-sections px-3 md:px-4 pt-3 pb-4 space-y-5">';
    if (!locations.length) {
      html += '<div class="card rounded-2xl p-6 text-center"><div class="text-[14px] font-semibold text-slate-900">No matching storage</div><div class="text-[13px] text-slate-500 mt-1">Try a different room, storage ID or location code.</div></div>';
    }
    rooms.forEach(function (room) {
      var locs = locations.filter(function (loc) { return loc.room === room.code; });
      if (!locs.length) return;
      html += '<section><div class="flex items-baseline justify-between mb-2"><div class="flex items-center gap-2">';
      html += '<h2 class="font-display text-[14.5px] font-semibold text-slate-900">' + esc(room.name || room.code) + '</h2>';
      if (room.rollout) html += '<span class="pill pill-teal">419A rollout</span>';
      html += '</div><div class="text-[11.5px] text-slate-500">' + locs.length + ' storage</div></div><div class="storage-grid">';
      locs.forEach(function (loc) { html += renderLocationCard(loc); });
      html += '</div></section>';
    });
    html += '</div>';
    return html;
  }

  function renderOperationsTiles() {
    return '<section class="workshop-tools px-3 md:px-4 pt-2 pb-12"><button data-action="toggle-tools" class="workshop-tools-toggle">' +
      '<span>' + icon('grid', 16) + 'Workshop tools</span><small>' + (toolsOpen ? 'Hide' : 'Show') + '</small></button>' +
      '<div class="workshop-tools-content ' + (toolsOpen ? 'is-open' : '') + '">' +
      opsTile('storage', 'grid', 'Storage Master', (appData.locations || []).length + ' storages - ' + (appData.locations || []).filter(function (loc) { return loc.qrReady; }).length + ' QR-ready') +
      opsTile('lowstock', 'warn', 'Low Stock', countLowStock() + ' items to review', 'amber') +
      opsTile('maintenance', 'cpu', 'Maintenance & Safety', countMaintenance() + ' maintenance - ' + countChemicals() + ' chemical', 'orange') +
      opsTile('audit', 'list', 'Audit Log', ((appData.audit || []).length || 0) + ' recent events') +
      opsTile('admin', 'shield', 'Readiness', 'Score ' + (((appData.readiness || {}).score) || 0) + ' - ' + (((appData.readiness || {}).errors) || 0) + ' errors') +
      opsTile('labels', 'printer', 'QR Labels', 'Print-ready label preview') +
      '</div></section>';
  }

  function opsTile(action, iconName, label, hint, tone) {
    var toneClass = tone === 'amber' ? 'bg-amber-50 text-amber-800 border-amber-200' :
      (tone === 'orange' ? 'bg-orange-50 text-orange-800 border-orange-200' : 'bg-slate-100 text-slate-700 border-slate-200');
    return '<button data-action="' + esc(action) + '" class="card rounded-xl p-3 text-left hover:bg-slate-50 active:bg-slate-100 transition-colors">' +
      '<div class="w-8 h-8 rounded-lg flex items-center justify-center border ' + toneClass + '">' + icon(iconName, 16) + '</div>' +
      '<div class="font-display text-[13px] font-semibold text-slate-900 mt-2">' + esc(label) + '</div>' +
      '<div class="text-[10.5px] text-slate-500 mt-0.5 truncate">' + esc(hint || '') + '</div>' +
      '</button>';
  }

  function eachItem(callback) {
    Object.keys(appData.items || {}).forEach(function (key) {
      (appData.items[key] || []).forEach(function (item) {
        callback(item, findLocationByKey(key), key);
      });
    });
  }

  function countLowStock() {
    var total = 0;
    eachItem(function (item) {
      if (item.status === 'Low Stock' || item.status === 'Missing') total += 1;
    });
    return total;
  }

  function countMaintenance() {
    var total = 0;
    eachItem(function (item) {
      if (item.status === 'Needs Maintenance' || item.maintenanceDue) total += 1;
    });
    return total;
  }

  function countChemicals() {
    var total = 0;
    eachItem(function (item) {
      if (item.hazard) total += 1;
    });
    return total;
  }

  function renderLocationCard(loc) {
    var cat = String(loc.id || '').toUpperCase();
    var iconName = loc.hazard ? 'flask' : (cat.indexOf('TOL') === 0 ? 'wrench' : (cat.indexOf('MAC') === 0 ? 'cpu' : 'box'));
    var iconTone = loc.hazard ? 'bg-red-50 text-red-700' : (cat.indexOf('TOL') === 0 ? 'bg-amber-50 text-amber-800' : (cat.indexOf('MAC') === 0 ? 'bg-blue-50 text-blue-700' : 'bg-slate-100 text-slate-700'));
    var routeId = routeIdentity(loc);
    var routeLabel = routeIdentityLabel(loc);
    var secondary = secondaryIdentity(loc);
    var html = '<article class="card storage-card rounded-2xl overflow-hidden" data-location-key="' + esc(loc.key) + '">';
    html += '<button data-action="view-location" data-location-key="' + esc(loc.key) + '" class="storage-card-main w-full text-left px-3.5 py-3 flex items-start gap-3 hover:bg-slate-50">';
    html += '<div class="shrink-0 w-10 h-10 rounded-xl flex items-center justify-center ' + iconTone + '">' + icon(iconName, 18) + '</div>';
    html += '<div class="flex-1 min-w-0"><div class="flex items-center gap-1.5 flex-wrap"><h3 class="font-display text-[15px] font-semibold text-slate-900 truncate">' + esc(loc.label) + '</h3>' + (loc.hazard ? hazardPill() : '') + '</div>';
    if (loc.specific) html += '<div class="text-[12px] text-slate-500 mt-0.5 truncate">' + esc(loc.specific) + '</div>';
    if (routeId) html += '<div class="identity-card mt-2"><span>' + esc(routeLabel) + '</span><strong>' + esc(routeId) + '</strong></div>';
    if (secondary) html += '<div class="text-[10.5px] text-slate-500 mt-1 truncate">' + esc(secondary) + '</div>';
    html += '<div class="flex items-center gap-1.5 mt-1.5 flex-wrap">';
    if (loc.id && loc.id !== routeId) html += '<span class="pill pill-neutral font-mono text-[10.5px]">' + esc(loc.id) + '</span>';
    if (loc.code && loc.code !== routeId) html += '<span class="pill pill-blue font-mono text-[10.5px]">' + esc(loc.code) + '</span>';
    if (loc.storageType) html += '<span class="pill pill-neutral">' + esc(loc.storageType) + '</span>';
    if (!loc.itemCount && !loc.items) html += '<span class="pill pill-neutral">Empty</span>';
    if (loc.qrReady) html += '<span class="pill pill-good">QR ready</span>';
    else html += '<span class="pill" style="background:#fff7ed;color:#9a3412">QR missing</span>';
    if (loc.chemicalCount) html += '<span class="pill pill-hazard">' + esc(loc.chemicalCount) + ' chemical</span>';
    if (loc.attentionCount || loc.attention) html += '<span class="pill pill-low">' + esc(loc.attentionCount || loc.attention) + ' attention</span>';
    html += '</div></div><div class="storage-card-count shrink-0 text-right"><div class="font-display text-[20px] font-semibold text-slate-900 leading-none">' + esc(loc.itemCount || loc.items || 0) + '</div><div class="text-[10.5px] text-slate-500 mt-0.5 uppercase tracking-wide">items</div></div>';
    html += '</button><div class="storage-card-actions border-t border-slate-100 px-2 py-1.5 flex gap-1">';
    html += '<button data-action="view-location" data-location-key="' + esc(loc.key) + '" class="flex-1 py-2 rounded-lg text-[12.5px] font-semibold text-slate-700 hover:bg-slate-50 flex items-center justify-center gap-1.5">' + icon('search', 13) + 'View</button>';
    html += '<div class="w-px bg-slate-100"></div><button data-action="tech-location" data-location-key="' + esc(loc.key) + '" class="flex-1 py-2 rounded-lg text-[12.5px] font-semibold text-blue-700 hover:bg-blue-50 flex items-center justify-center gap-1.5">' + icon('edit', 13) + 'Update</button>';
    html += '</div></article>';
    return html;
  }

  function renderLocation() {
    var loc = route.loc;
    var updateUnlocked = route.mode === 'tech' && isUpdateUnlocked();
    var room = (appData.rooms || []).filter(function (r) { return r.code === loc.room; })[0] || { code: loc.room, name: 'Room ' + loc.room };
    localItems = (appData.items[loc.key] || []).map(function (item) {
      return Object.assign({}, item, { changed: !!item.changed, _orig: item._orig || { qty: item.qty, status: item.status } });
    });

    if (!localItems.length && route.mode !== 'tech') return renderEmptyLocation(loc, room);

    var q = route.itemQ || '';
    var status = route.status || 'All';
    var category = route.category || 'All';
    var categoryOptions = ['All'];
    localItems.forEach(function (item) {
      if (item.category && categoryOptions.indexOf(item.category) === -1) categoryOptions.push(item.category);
    });
    categoryOptions.sort(function (a, b) {
      if (a === 'All') return -1;
      if (b === 'All') return 1;
      return a.localeCompare(b);
    });
    var filtered = localItems.filter(function (item) {
      if (status !== 'All' && item.status !== status) return false;
      if (category !== 'All' && item.category !== category) return false;
      if (!q) return true;
      return [item.id, item.name, item.category, item.remarks, item.safetyNote, item.supplier].filter(Boolean).join(' ').toLowerCase().indexOf(q.toLowerCase()) !== -1;
    });
    var stats = {
      total: localItems.length,
      hazard: localItems.filter(function (item) { return item.hazard; }).length,
      attention: localItems.filter(function (item) { return item.status !== 'Good'; }).length
    };
    var html = '<div class="min-h-full ' + (route.mode === 'tech' ? 'mode-tech-bg' : '') + '">' + renderContextStrip(loc, room);
    if (route.mode === 'tech') {
      html += '<div class="px-4 pt-3"><div class="update-mode-note">' +
        '<div class="flex items-start gap-3"><div class="min-w-0 flex-1"><div class="font-semibold text-amber-950 flex items-center gap-1.5">' + icon('edit', 14) + 'Update Mode</div>' +
        '<div class="text-[12px] text-amber-900/90 mt-1">Add items, remove items, or change quantity/status only for this storage. Every saved change writes to Inventory and Audit_Log.</div></div>' +
        (updateUnlocked ? '<button data-action="open-add-item" class="btn btn-primary py-2 px-3 text-[12px] shrink-0">' + icon('plus', 14) + ' Add item</button>' : '') + '</div>' +
        '</div></div>';
      if (!updateUnlocked) html += renderUpdateAuthPanel();
    } else if (loc.hazard) {
      html += '<div class="px-4 pt-3"><div class="hazard-callout">' +
        '<div class="font-semibold text-red-900 flex items-center gap-1.5">' + icon('hazard', 14) + 'Chemical storage</div>' +
        '<div class="text-[12px] text-red-900/90 mt-1">Check safety note, SDS, PPE and teacher/technician guidance before handling chemicals.</div>' +
        '</div></div>';
    }
    html += '<div class="px-4 pt-3"><div class="flex items-center gap-1.5 flex-wrap text-[11.5px]"><span class="pill pill-neutral">' + stats.total + ' item' + (stats.total === 1 ? '' : 's') + '</span>';
    if (stats.hazard) html += '<span class="pill pill-hazard">' + stats.hazard + ' chemical</span>';
    if (stats.attention) html += '<span class="pill pill-low">' + stats.attention + ' need attention</span>';
    html += '</div></div>';
    html += '<div class="location-filters px-4 pt-2.5 grid grid-cols-1 sm:grid-cols-[1fr_125px_150px] gap-2"><div class="relative">' + icon('search', 15, 'absolute left-3 top-1/2 -translate-y-1/2 text-slate-400') +
      '<input id="itemSearch" value="' + esc(q) + '" class="input pl-9 py-2.5 text-[14px]" placeholder="Search items..."/></div>';
    html += '<select id="statusFilter" class="select py-2.5 text-[13px] w-full sm:w-[125px]">' + ['All', 'Good', 'Low Stock', 'Missing', 'Needs Maintenance'].map(function (option) {
      return '<option ' + (option === status ? 'selected' : '') + '>' + esc(option) + '</option>';
    }).join('') + '</select>';
    html += '<select id="categoryFilter" class="select py-2.5 text-[13px] w-full sm:w-[150px]">' + categoryOptions.map(function (option) {
      return '<option ' + (option === category ? 'selected' : '') + '>' + esc(option) + '</option>';
    }).join('') + '</select></div>';
    if (updateUnlocked && addFormOpen) html += renderAddItemForm();
    html += renderSaveNotice();
    html += '<div class="px-4 pt-3 ' + (updateUnlocked ? 'pb-32' : 'pb-8') + ' space-y-2.5">';
    filtered.forEach(function (item) { html += renderItemCard(item); });
    if (!filtered.length) html += '<div class="text-center py-8 text-[13px] text-slate-500">No matching items.</div>';
    html += '</div>';
    if (updateUnlocked) html += renderSaveBar();
    html += '</div>';
    return html;
  }

  function renderUpdateAuthPanel() {
    var auth = updateAuthState();
    var msg = auth.message || 'Unlock Update Mode before changing live inventory.';
    var html = '<div class="px-4 pt-3"><div class="rounded-2xl border border-amber-200 bg-white p-4 text-amber-950 shadow-sm">' +
      '<div class="font-display text-[17px] font-semibold flex items-center gap-2">' + icon('shield', 17) + 'Update Mode locked</div>' +
      '<div class="mt-1 text-[14px] leading-relaxed">' + esc(msg) + '</div>' +
      '<div class="mt-2 text-[13px] text-amber-800">Viewing remains available. Saving, adding, and removing require server authorization.</div>';
    if (auth.pinEnabled) {
      html += '<div class="mt-3 grid grid-cols-1 sm:grid-cols-[1fr_auto] gap-2">' +
        '<input id="updateAuthPin" class="input" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter Update Mode PIN"/>' +
        '<button data-action="unlock-update" class="btn btn-primary">' + icon('shield', 14) + ' Unlock</button></div>';
    } else if (!auth.configured) {
      html += '<div class="mt-3 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[13px]">Administrator setup required: configure staff emails/domains or a hashed PIN in Apps Script Script Properties.</div>';
    } else {
      html += '<div class="mt-3 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[13px]">This Google account is not authorised for Update Mode. Ask an administrator to update access settings.</div>';
    }
    return html + '</div></div>';
  }

  function renderContextStrip(loc, room) {
    var routeId = routeIdentity(loc);

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        var area = document.createElement('textarea');
        area.value = text;
        area.setAttribute('readonly', '');
        area.style.position = 'fixed';
        area.style.left = '-9999px';
        document.body.appendChild(area);
        area.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(area);
        ok ? resolve() : reject(new Error('copy failed'));
      } catch (err) {
        reject(err);
      }
    });
  }

  function copyScannerEvidenceReport() {
