<script>
(function () {
  'use strict';

  var BOOT = window.__BOOTSTRAP__ || {};
  var root = document.getElementById('root');
  var appData = BOOT.appData || emptyAppData();
  var diagnostics = BOOT.diagnostics || {};
  var route = initialRoute();
  var localItems = [];
  var saveState = 'idle';
  var saveError = '';
  var saveMessage = '';
  var addFormOpen = false;

  function emptyAppData() {
    return {
      metrics: {
        totalRooms: 0,
        totalLocations: 0,
        totalItems: 0,
        totalChemicals: 0,
        totalAttention: 0
      },
      rooms: [],
      locations: [],
      items: {},
      readiness: {
        score: 0,
        errors: 0,
        warnings: 0,
        missingQr: 0,
        missingStorageId: 0,
        invalidQty: 0,
        invalidStatus: 0,
        duplicates: 0,
        validationLoaded: false,
        issueSample: [],
        rollout419A: { ready: 0, total: 0, pct: 0, itemCount: 0, chemicalCount: 0 }
      },
      audit: []
    };
  }

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function textValue(value) {
    return String(value == null ? '' : value).trim();
  }

  function icon(name, size, cls) {
    var s = 'width="' + (size || 18) + '" height="' + (size || 18) + '" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="' + esc(cls || '') + '"';
    var path = '';
    switch (name) {
      case 'search': path = '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>'; break;
      case 'edit': path = '<path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>'; break;
      case 'warn': path = '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0ZM12 9v4M12 17h.01"/>'; break;
      case 'hazard': path = '<path d="M12 3 22 20H2Z"/><path d="M12 10v4M12 18h.01"/>'; break;
      case 'arrow-left': path = '<path d="M19 12H5M12 19l-7-7 7-7"/>'; break;
      case 'plus': path = '<path d="M12 5v14M5 12h14"/>'; break;
      case 'minus': path = '<path d="M5 12h14"/>'; break;
      case 'box': path = '<path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>'; break;
      case 'flask': path = '<path d="M9 3h6M10 3v6.5L4 19a2 2 0 0 0 1.7 3h12.6A2 2 0 0 0 20 19l-6-9.5V3"/>'; break;
      case 'wrench': path = '<path d="M14.7 6.3a4 4 0 1 0 4.99 4.99l-2.4-2.4 2.4-2.4-2.6-2.6-2.4 2.4ZM4 20l9-9"/>'; break;
      case 'cpu': path = '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>'; break;
      case 'printer': path = '<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>'; break;
      case 'shield': path = '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>'; break;
      case 'grid': path = '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'; break;
      case 'list': path = '<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>'; break;
      case 'building': path = '<path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h7v18M14 8h3a2 2 0 0 1 2 2v11M8 7h2M8 11h2M8 15h2"/>'; break;
      case 'scan': path = '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/>'; break;
      case 'external': path = '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/>'; break;
      case 'save': path = '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/>'; break;
      case 'info': path = '<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/>'; break;
      default: path = '<path d="M5 12h14M12 5l7 7-7 7"/>';
    }
    return '<svg ' + s + ' viewBox="0 0 24 24">' + path + '</svg>';
  }

  function statusPill(status) {
    var key = String(status || 'Good');
    var cfg = {
      'Good': ['pill-good', 'dot-good'],
      'Low Stock': ['pill-low', 'dot-low'],
      'Missing': ['pill-miss', 'dot-miss'],
      'Needs Maintenance': ['pill-maint', 'dot-maint']
    }[key] || ['pill-neutral', 'dot-good'];
    return '<span class="pill ' + cfg[0] + '"><span class="dot ' + cfg[1] + '"></span>' + esc(key) + '</span>';
  }

  function hazardPill() {
    return '<span class="pill pill-hazard">' + icon('hazard', 12) + 'Chemical</span>';
  }

  function routeIdentity(loc) {
    if (!loc) return '';
    return loc.routeLoc || loc.id || loc.code || loc.storageId || loc.specific || loc.label || '';
  }

  function secondaryIdentity(loc) {
    if (!loc) return '';
    var primary = routeIdentity(loc);
    var parts = [];
    if (loc.code && loc.code !== primary) parts.push('Location Code ' + loc.code);
    if (loc.storageId && loc.storageId !== primary) parts.push('Workbook Storage ID ' + loc.storageId);
    if (loc.storageLabel && loc.storageLabel !== loc.label) parts.push(loc.storageLabel);
    return parts.join(' · ');
  }

  function routeIdentityLabel(loc) {
    var routeId = routeIdentity(loc);
    var is419ALocationCode = loc && loc.room === '419A' && /^419A-[A-Z0-9]+(?:-[A-Z0-9]+)*$/i.test(routeId);
    return is419ALocationCode ? 'Location Code' : 'Storage route';
  }

  function metric(label, value, sub, tone) {
    var toneClass = tone === 'rollout' ? 'border-teal-200 bg-[var(--vsa-teal-soft)]' : '';
    var labelClass = tone === 'rollout' ? 'text-teal-700' : 'text-slate-500';
    var valueClass = tone === 'rollout' ? 'text-teal-900' : 'text-slate-900';
    return '<div class="card-flat rounded-2xl px-3.5 py-3 ' + toneClass + '">' +
      '<div class="text-[10.5px] font-semibold uppercase tracking-[0.16em] ' + labelClass + '">' + esc(label) + '</div>' +
      '<div class="mt-1 text-[22px] font-semibold leading-none font-display ' + valueClass + '">' + esc(value) + '</div>' +
      (sub ? '<div class="mt-1 text-[11px] text-slate-500">' + esc(sub) + '</div>' : '') +
      '</div>';
  }

  function initialRoute() {
    if (BOOT.error) return { name: 'error', kind: 'generic', message: BOOT.error };
    if (BOOT.route && BOOT.route.name === 'error') {
      return { name: 'error', kind: BOOT.route.kind || 'generic', message: BOOT.route.message || '' };
    }
    if (BOOT.route && BOOT.route.name === 'labels') {
      return { name: 'labels' };
    }
    if (BOOT.route && BOOT.route.name === 'storage') return { name: 'storage' };
    if (BOOT.route && BOOT.route.name === 'audit') return { name: 'audit' };
    if (BOOT.route && BOOT.route.name === 'lowstock') return { name: 'lowstock' };
    if (BOOT.route && BOOT.route.name === 'maintenance') return { name: 'maintenance' };
    if (BOOT.route && BOOT.route.name === 'admin') {
      return { name: 'admin', admin: BOOT.route.admin || 'readiness' };
    }
    if (BOOT.route && BOOT.route.name === 'location' && BOOT.route.locKey) {
      var loc = findLocationByKey(BOOT.route.locKey);
      if (loc) return { name: 'location', loc: loc, mode: BOOT.route.mode === 'tech' ? 'tech' : 'view' };
      return { name: 'error', kind: 'no-match', message: 'No matching storage location was found.' };
    }
    return { name: 'landing', room: 'All', q: '' };
  }

  function findLocationByKey(key) {
    return (appData.locations || []).filter(function (loc) { return loc.key === key; })[0] || null;
  }

  function updateUrl(params) {
    var url = new URL(window.location.href);
    ['room', 'loc', 'mode', 'admin'].forEach(function (key) { url.searchParams.delete(key); });
    Object.keys(params || {}).forEach(function (key) {
      if (params[key]) url.searchParams.set(key, params[key]);
    });
    window.history.replaceState({}, '', url.toString());
  }

  function setRoute(next) {
    route = next;
    saveState = 'idle';
    saveError = '';
    saveMessage = '';
    addFormOpen = false;
    render();
  }

  function goLanding() {
    updateUrl({});
    setRoute({ name: 'landing', room: 'All', q: '' });
  }

  function goLocation(loc, mode) {
    updateUrl({ room: loc.room, loc: loc.routeLoc || loc.id, mode: mode === 'tech' ? 'tech' : '' });
    setRoute({ name: 'location', loc: loc, mode: mode === 'tech' ? 'tech' : 'view' });
  }

  function toggleMode() {
    if (!route.loc) return;
    var nextMode = route.mode === 'tech' ? 'view' : 'tech';
    updateUrl({ room: route.loc.room, loc: route.loc.routeLoc || route.loc.id, mode: nextMode === 'tech' ? 'tech' : '' });
    setRoute({ name: 'location', loc: route.loc, mode: nextMode });
  }

  function render() {
    if (!root) return;
    if (route.name === 'error') root.innerHTML = shell(renderError());
    else if (route.name === 'admin') root.innerHTML = shell(renderAdmin(), true);
    else if (route.name === 'labels') root.innerHTML = shell(renderLabels(), true);
    else if (route.name === 'storage') root.innerHTML = shell(renderStorageMaster(), true);
    else if (route.name === 'audit') root.innerHTML = shell(renderAuditLog(), true);
    else if (route.name === 'lowstock') root.innerHTML = shell(renderLowStock(), true);
    else if (route.name === 'maintenance') root.innerHTML = shell(renderMaintenance(), true);
    else if (route.name === 'location') root.innerHTML = shell(renderLocation());
    else root.innerHTML = shell(renderLanding(), true);
    bindCurrentRoute();
  }

  function shell(content, wide) {
    return '<div class="app-shell' + (wide ? ' wide' : '') + '">' + content + '</div>';
  }

  function renderLanding() {
    var q = (route.q || '').toLowerCase();
    var selectedRoom = route.room || 'All';
    var rooms = appData.rooms || [];
    var locations = (appData.locations || []).filter(function (loc) {
      if (selectedRoom !== 'All' && loc.room !== selectedRoom) return false;
      if (!q) return true;
      return [
        loc.searchText, loc.id, loc.label, loc.specific, loc.code, loc.room, loc.storageId, loc.storageLabel
      ].filter(Boolean).join(' ').toLowerCase().indexOf(q) !== -1;
    });

    var totals = appData.metrics || {
      totalRooms: rooms.length,
      totalLocations: (appData.locations || []).length,
      totalItems: rooms.reduce(function (sum, room) { return sum + (Number(room.itemCount) || 0); }, 0),
      totalChemicals: rooms.reduce(function (sum, room) { return sum + (Number(room.chemicalCount) || 0); }, 0),
      totalAttention: rooms.reduce(function (sum, room) { return sum + (Number(room.attentionCount || room.attention) || 0); }, 0)
    };
    var r = (appData.readiness && appData.readiness.rollout419A) || { pct: 0, ready: 0, total: 0 };
    var html = '';
    html += '<div class="bg-white border-b border-slate-200 px-4 pt-4 pb-3">';
    html += '<div class="flex items-center justify-between"><div>';
    html += '<div class="text-[10.5px] font-semibold uppercase tracking-[0.2em] text-blue-700">Victoria Shanghai Academy</div>';
    html += '<h1 class="font-display text-[19px] font-semibold text-slate-900 mt-0.5">D&amp;T QR Inventory</h1>';
    html += '</div><div class="flex items-center gap-1.5">';
    html += '<button data-action="labels" class="tap rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-600" title="QR Labels">' + icon('printer', 20) + '</button>';
    html += '<button data-action="admin" class="tap rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-600" title="Admin readiness">' + icon('shield', 20) + '</button>';
    html += '</div></div></div>';

    if (!BOOT.webAppBaseUrl) {
      html += '<div class="mx-4 mt-3 rounded-xl bg-amber-50 border border-amber-200 px-3 py-2.5 text-[12.5px] text-amber-900 flex gap-2">' +
        icon('warn', 16, 'shrink-0 mt-0.5') +
        '<div><div class="font-semibold">WEB_APP_BASE_URL is not configured</div><div class="text-amber-800/90 mt-0.5">Browsing works, but QR generation and external printed links are disabled.</div></div></div>';
    }

    html += '<div class="px-4 pt-3"><div class="route-principle">' +
      '<div class="route-principle-icon">' + icon('scan', 18) + '</div>' +
      '<div class="min-w-0"><div class="font-display text-[13px] font-semibold text-slate-900">One web app URL, many storage routes</div>' +
      '<div class="text-[12px] text-slate-600 mt-0.5">Printed QR labels open View Mode first. Authorised staff enter Update inside the app.</div>' +
      '<div class="route-example">/exec?room=419A&amp;loc=419A-FCU-01</div></div>' +
      '</div></div>';

    html += '<div class="px-4 pt-4 space-y-2">';
    html += metric('419A rollout', r.pct + '%', r.ready + '/' + r.total + ' storages QR-ready', 'rollout');
    html += '<div class="grid grid-cols-2 md:grid-cols-5 gap-2">' +
      metric('Rooms', totals.totalRooms) +
      metric('Storages', totals.totalLocations) +
      metric('Items', totals.totalItems) +
      metric('Chemicals', totals.totalChemicals) +
      metric('Attention', totals.totalAttention) +
      '</div>';
    html += '</div>';

    html += '<div class="px-4 pt-3"><div class="relative">' + icon('search', 16, 'absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400') +
      '<input id="landingSearch" value="' + esc(route.q || '') + '" class="input pl-10" placeholder="Search room, storage ID, label, code..."/></div></div>';

    html += renderOperationsTiles();

    html += '<div class="px-4 pt-3 pb-1 flex gap-2 overflow-x-auto no-scrollbar">';
    html += '<button data-room-tab="All" class="room-tab ' + (selectedRoom === 'All' ? 'is-active' : '') + '">All rooms</button>';
    rooms.forEach(function (room) {
      html += '<button data-room-tab="' + esc(room.code) + '" class="room-tab ' + (room.rollout ? 'rollout ' : '') + (selectedRoom === room.code ? 'is-active' : '') + '">' + esc(room.code) + (room.rollout ? ' - 419A rollout' : '') + '</button>';
    });
    html += '</div>';

    html += '<div class="px-4 pt-3 pb-12 space-y-5">';
    if (!locations.length) {
      html += '<div class="card rounded-2xl p-6 text-center"><div class="text-[14px] font-semibold text-slate-900">No matching storage</div><div class="text-[13px] text-slate-500 mt-1">Try a different room, storage ID or location code.</div></div>';
    }
    rooms.forEach(function (room) {
      var locs = locations.filter(function (loc) { return loc.room === room.code; });
      if (!locs.length) return;
      html += '<section><div class="flex items-baseline justify-between mb-2"><div class="flex items-center gap-2">';
      html += '<h2 class="font-display text-[14.5px] font-semibold text-slate-900">' + esc(room.name || room.code) + '</h2>';
      if (room.rollout) html += '<span class="pill pill-teal">419A rollout</span>';
      html += '</div><div class="text-[11.5px] text-slate-500">' + locs.length + ' storage</div></div><div class="storage-grid">';
      locs.forEach(function (loc) { html += renderLocationCard(loc); });
      html += '</div></section>';
    });
    html += '</div>';
    return html;
  }

  function renderOperationsTiles() {
    return '<div class="px-4 pt-3"><div class="grid grid-cols-2 md:grid-cols-3 gap-2">' +
      opsTile('storage', 'grid', 'Storage Master', (appData.locations || []).length + ' storages - ' + (appData.locations || []).filter(function (loc) { return loc.qrReady; }).length + ' QR-ready') +
      opsTile('lowstock', 'warn', 'Low Stock', countLowStock() + ' items to review', 'amber') +
      opsTile('maintenance', 'cpu', 'Maintenance & Safety', countMaintenance() + ' maintenance - ' + countChemicals() + ' chemical', 'orange') +
      opsTile('audit', 'list', 'Audit Log', ((appData.audit || []).length || 0) + ' recent events') +
      opsTile('admin', 'shield', 'Readiness', 'Score ' + (((appData.readiness || {}).score) || 0) + ' - ' + (((appData.readiness || {}).errors) || 0) + ' errors') +
      opsTile('labels', 'printer', 'QR Labels', 'Print-ready label preview') +
      '</div></div>';
  }

  function opsTile(action, iconName, label, hint, tone) {
    var toneClass = tone === 'amber' ? 'bg-amber-50 text-amber-800 border-amber-200' :
      (tone === 'orange' ? 'bg-orange-50 text-orange-800 border-orange-200' : 'bg-slate-100 text-slate-700 border-slate-200');
    return '<button data-action="' + esc(action) + '" class="card rounded-xl p-3 text-left hover:bg-slate-50 active:bg-slate-100 transition-colors">' +
      '<div class="w-8 h-8 rounded-lg flex items-center justify-center border ' + toneClass + '">' + icon(iconName, 16) + '</div>' +
      '<div class="font-display text-[13px] font-semibold text-slate-900 mt-2">' + esc(label) + '</div>' +
      '<div class="text-[10.5px] text-slate-500 mt-0.5 truncate">' + esc(hint || '') + '</div>' +
      '</button>';
  }

  function eachItem(callback) {
    Object.keys(appData.items || {}).forEach(function (key) {
      (appData.items[key] || []).forEach(function (item) {
        callback(item, findLocationByKey(key), key);
      });
    });
  }

  function countLowStock() {
    var total = 0;
    eachItem(function (item) {
      if (item.status === 'Low Stock' || item.status === 'Missing') total += 1;
    });
    return total;
  }

  function countMaintenance() {
    var total = 0;
    eachItem(function (item) {
      if (item.status === 'Needs Maintenance' || item.maintenanceDue) total += 1;
    });
    return total;
  }

  function countChemicals() {
    var total = 0;
    eachItem(function (item) {
      if (item.hazard) total += 1;
    });
    return total;
  }

  function renderLocationCard(loc) {
    var cat = String(loc.id || '').toUpperCase();
    var iconName = loc.hazard ? 'flask' : (cat.indexOf('TOL') === 0 ? 'wrench' : (cat.indexOf('MAC') === 0 ? 'cpu' : 'box'));
    var iconTone = loc.hazard ? 'bg-red-50 text-red-700' : (cat.indexOf('TOL') === 0 ? 'bg-amber-50 text-amber-800' : (cat.indexOf('MAC') === 0 ? 'bg-blue-50 text-blue-700' : 'bg-slate-100 text-slate-700'));
    var routeId = routeIdentity(loc);
    var routeLabel = routeIdentityLabel(loc);
    var secondary = secondaryIdentity(loc);
    var html = '<article class="card rounded-2xl overflow-hidden" data-location-key="' + esc(loc.key) + '">';
    html += '<button data-action="view-location" data-location-key="' + esc(loc.key) + '" class="w-full text-left px-3.5 py-3 flex items-start gap-3 hover:bg-slate-50">';
    html += '<div class="shrink-0 w-10 h-10 rounded-xl flex items-center justify-center ' + iconTone + '">' + icon(iconName, 18) + '</div>';
    html += '<div class="flex-1 min-w-0"><div class="flex items-center gap-1.5 flex-wrap"><h3 class="font-display text-[15px] font-semibold text-slate-900 truncate">' + esc(loc.label) + '</h3>' + (loc.hazard ? hazardPill() : '') + '</div>';
    if (loc.specific) html += '<div class="text-[12px] text-slate-500 mt-0.5 truncate">' + esc(loc.specific) + '</div>';
    if (routeId) html += '<div class="identity-card mt-2"><span>' + esc(routeLabel) + '</span><strong>' + esc(routeId) + '</strong></div>';
    if (secondary) html += '<div class="text-[10.5px] text-slate-500 mt-1 truncate">' + esc(secondary) + '</div>';
    html += '<div class="flex items-center gap-1.5 mt-1.5 flex-wrap">';
    if (loc.id && loc.id !== routeId) html += '<span class="pill pill-neutral font-mono text-[10.5px]">' + esc(loc.id) + '</span>';
    if (loc.code && loc.code !== routeId) html += '<span class="pill pill-blue font-mono text-[10.5px]">' + esc(loc.code) + '</span>';
    if (loc.storageType) html += '<span class="pill pill-neutral">' + esc(loc.storageType) + '</span>';
    if (!loc.itemCount && !loc.items) html += '<span class="pill pill-neutral">Empty</span>';
    if (loc.qrReady) html += '<span class="pill pill-good">QR ready</span>';
    else html += '<span class="pill" style="background:#fff7ed;color:#9a3412">QR missing</span>';
    if (loc.chemicalCount) html += '<span class="pill pill-hazard">' + esc(loc.chemicalCount) + ' chemical</span>';
    if (loc.attentionCount || loc.attention) html += '<span class="pill pill-low">' + esc(loc.attentionCount || loc.attention) + ' attention</span>';
    html += '</div></div><div class="shrink-0 text-right"><div class="font-display text-[20px] font-semibold text-slate-900 leading-none">' + esc(loc.itemCount || loc.items || 0) + '</div><div class="text-[10.5px] text-slate-500 mt-0.5 uppercase tracking-wide">items</div></div>';
    html += '</button><div class="border-t border-slate-100 px-2 py-1.5 flex gap-1">';
    html += '<button data-action="view-location" data-location-key="' + esc(loc.key) + '" class="flex-1 py-2 rounded-lg text-[12.5px] font-semibold text-slate-700 hover:bg-slate-50 flex items-center justify-center gap-1.5">' + icon('search', 13) + 'View</button>';
    html += '<div class="w-px bg-slate-100"></div><button data-action="tech-location" data-location-key="' + esc(loc.key) + '" class="flex-1 py-2 rounded-lg text-[12.5px] font-semibold text-blue-700 hover:bg-blue-50 flex items-center justify-center gap-1.5">' + icon('edit', 13) + 'Update</button>';
    html += '</div></article>';
    return html;
  }

  function renderLocation() {
    var loc = route.loc;
    var room = (appData.rooms || []).filter(function (r) { return r.code === loc.room; })[0] || { code: loc.room, name: 'Room ' + loc.room };
    localItems = (appData.items[loc.key] || []).map(function (item) {
      return Object.assign({}, item, { changed: !!item.changed, _orig: item._orig || { qty: item.qty, status: item.status } });
    });

    if (!localItems.length && route.mode !== 'tech') return renderEmptyLocation(loc, room);

    var q = route.itemQ || '';
    var status = route.status || 'All';
    var category = route.category || 'All';
    var categoryOptions = ['All'];
    localItems.forEach(function (item) {
      if (item.category && categoryOptions.indexOf(item.category) === -1) categoryOptions.push(item.category);
    });
    categoryOptions.sort(function (a, b) {
      if (a === 'All') return -1;
      if (b === 'All') return 1;
      return a.localeCompare(b);
    });
    var filtered = localItems.filter(function (item) {
      if (status !== 'All' && item.status !== status) return false;
      if (category !== 'All' && item.category !== category) return false;
      if (!q) return true;
      return [item.id, item.name, item.category, item.remarks, item.safetyNote, item.supplier].filter(Boolean).join(' ').toLowerCase().indexOf(q.toLowerCase()) !== -1;
    });
    var stats = {
      total: localItems.length,
      hazard: localItems.filter(function (item) { return item.hazard; }).length,
      attention: localItems.filter(function (item) { return item.status !== 'Good'; }).length
    };
    var html = '<div class="min-h-full ' + (route.mode === 'tech' ? 'mode-tech-bg' : '') + '">' + renderContextStrip(loc, room);
    if (route.mode === 'tech') {
      html += '<div class="px-4 pt-3"><div class="update-mode-note">' +
        '<div class="flex items-start gap-3"><div class="min-w-0 flex-1"><div class="font-semibold text-amber-950 flex items-center gap-1.5">' + icon('edit', 14) + 'Update Mode</div>' +
        '<div class="text-[12px] text-amber-900/90 mt-1">Add items, remove items, or change quantity/status only for this storage. Every saved change writes to Inventory and Audit_Log.</div></div>' +
        '<button data-action="open-add-item" class="btn btn-primary py-2 px-3 text-[12px] shrink-0">' + icon('plus', 14) + ' Add item</button></div>' +
        '</div></div>';
    } else if (loc.hazard) {
      html += '<div class="px-4 pt-3"><div class="hazard-callout">' +
        '<div class="font-semibold text-red-900 flex items-center gap-1.5">' + icon('hazard', 14) + 'Chemical storage</div>' +
        '<div class="text-[12px] text-red-900/90 mt-1">Check safety note, SDS, PPE and teacher/technician guidance before handling chemicals.</div>' +
        '</div></div>';
    }
    html += '<div class="px-4 pt-3"><div class="flex items-center gap-1.5 flex-wrap text-[11.5px]"><span class="pill pill-neutral">' + stats.total + ' item' + (stats.total === 1 ? '' : 's') + '</span>';
    if (stats.hazard) html += '<span class="pill pill-hazard">' + stats.hazard + ' chemical</span>';
    if (stats.attention) html += '<span class="pill pill-low">' + stats.attention + ' need attention</span>';
    html += '</div></div>';
    html += '<div class="px-4 pt-2.5 grid grid-cols-1 sm:grid-cols-[1fr_125px_150px] gap-2"><div class="relative">' + icon('search', 15, 'absolute left-3 top-1/2 -translate-y-1/2 text-slate-400') +
      '<input id="itemSearch" value="' + esc(q) + '" class="input pl-9 py-2.5 text-[14px]" placeholder="Search items..."/></div>';
    html += '<select id="statusFilter" class="select py-2.5 text-[13px] w-full sm:w-[125px]">' + ['All', 'Good', 'Low Stock', 'Missing', 'Needs Maintenance'].map(function (option) {
      return '<option ' + (option === status ? 'selected' : '') + '>' + esc(option) + '</option>';
    }).join('') + '</select>';
    html += '<select id="categoryFilter" class="select py-2.5 text-[13px] w-full sm:w-[150px]">' + categoryOptions.map(function (option) {
      return '<option ' + (option === category ? 'selected' : '') + '>' + esc(option) + '</option>';
    }).join('') + '</select></div>';
    if (route.mode === 'tech' && addFormOpen) html += renderAddItemForm();
    html += renderSaveNotice();
    html += '<div class="px-4 pt-3 ' + (route.mode === 'tech' ? 'pb-32' : 'pb-8') + ' space-y-2.5">';
    filtered.forEach(function (item) { html += renderItemCard(item); });
    if (!filtered.length) html += '<div class="text-center py-8 text-[13px] text-slate-500">No matching items.</div>';
    html += '</div>';
    if (route.mode === 'tech') html += renderSaveBar();
    html += '</div>';
    return html;
  }

  function renderContextStrip(loc, room) {
    var routeId = routeIdentity(loc);
    var secondary = secondaryIdentity(loc);
    return '<div class="px-4 pt-3 pb-3 border-b border-slate-200 sticky top-0 z-10 ' + (route.mode === 'tech' ? 'bg-amber-50/90 backdrop-blur' : 'bg-white/95 backdrop-blur') + '">' +
      '<div class="flex items-center gap-2"><button data-action="back" class="tap rounded-lg hover:bg-white flex items-center justify-center text-slate-700 -ml-2">' + icon('arrow-left', 20) + '</button>' +
      '<div class="flex-1 min-w-0"><div class="flex items-center gap-1.5"><span class="text-[10.5px] font-semibold uppercase tracking-[0.18em] text-blue-700">' + esc(room.name || ('Room ' + loc.room)) + '</span>' +
      (room.rollout ? '<span class="pill pill-teal" style="padding:2px 7px;font-size:10px">419A</span>' : '') + '</div>' +
      '<h1 class="font-display text-[18px] font-semibold text-slate-900 leading-tight truncate flex items-center gap-1.5">' + esc(loc.label) + (loc.hazard ? icon('hazard', 15, 'text-red-600') : '') + '</h1>' +
      (loc.specific ? '<div class="text-[12px] text-slate-500 mt-0.5 truncate">' + esc(loc.specific) + '</div>' : '') + '</div>' +
      modeBadge(route.mode) + '</div><div class="mt-2.5 flex flex-wrap items-center gap-1.5">' +
      (routeId ? '<span class="route-badge"><span>' + esc(routeIdentityLabel(loc)) + '</span><strong>' + esc(routeId) + '</strong></span>' : '') +
      (loc.storageType ? '<span class="pill pill-neutral">' + esc(loc.storageType) + '</span>' : '') +
      '<button data-action="toggle-mode" class="ml-auto pill pill-blue hover:bg-blue-100" style="padding:5px 10px">' + icon(route.mode === 'view' ? 'edit' : 'search', 11) + (route.mode === 'view' ? 'Switch to Update' : 'Switch to View') + '</button>' +
      '</div>' +
      (secondary ? '<div class="mt-2 text-[11px] text-slate-500 truncate">' + esc(secondary) + '</div>' : '') +
      '</div>';
  }

  function modeBadge(mode) {
    if (mode === 'tech') return '<span class="pill" style="background:#fffbeb;color:#92400e;border:1px solid #fde68a">' + icon('edit', 11) + 'Update</span>';
    return '<span class="pill pill-blue">' + icon('search', 11) + 'View</span>';
  }

  function renderItemCard(item) {
    var changedClass = item.changed ? 'rounded-2xl row-changed' : '';
    var html = '<div class="' + changedClass + '"><article class="card-flat rounded-2xl border bg-white p-3.5 border-slate-200">';
    html += '<div class="flex items-start justify-between gap-3"><div class="min-w-0 flex-1"><div class="flex items-center gap-1.5 flex-wrap">';
    html += '<h3 class="font-display text-[15px] font-semibold text-slate-900 leading-tight">' + esc(item.name) + '</h3>' + (item.hazard ? hazardPill() : '') + '</div>';
    html += '<div class="mt-1 text-[11.5px] text-slate-500 flex flex-wrap gap-x-3 gap-y-0.5"><span class="font-mono">' + esc(item.id) + '</span>' + (item.category ? '<span>- ' + esc(item.category) + '</span>' : '') + (item.unit ? '<span>- ' + esc(item.unit) + '</span>' : '') + '</div>';
    if (item.remarks) html += '<div class="mt-2 text-[12.5px] text-slate-600"><span class="font-medium text-slate-800">Remarks:</span> ' + esc(item.remarks) + '</div>';
    if (item.safetyNote) html += '<div class="mt-2 text-[12.5px] text-red-800"><span class="font-medium">Safety:</span> ' + esc(item.safetyNote) + '</div>';
    if (item.reorderLevel || item.supplier || item.maintenanceDue) {
      html += '<div class="mt-2 flex flex-wrap gap-1.5 text-[11px] text-slate-600">';
      if (item.reorderLevel) html += '<span class="pill pill-neutral">Reorder at ' + esc(item.reorderLevel) + '</span>';
      if (item.supplier) html += '<span class="pill pill-neutral">Supplier: ' + esc(item.supplier) + '</span>';
      if (item.maintenanceDue) html += '<span class="pill pill-low">Maintenance due: ' + esc(item.maintenanceDue) + '</span>';
      html += '</div>';
    }
    if (item.hazard) html += '<div class="mt-2 rounded-lg bg-red-50 border border-red-100 px-2.5 py-1.5 text-[11.5px] text-red-800 flex gap-1.5">' + icon('shield', 13, 'shrink-0 mt-0.5') + '<span>' + esc(item.safetyNote || 'Handle per D&T chemical storage and safety procedures.') + '</span></div>';
    html += '</div>';
    if (route.mode === 'tech') html += renderTechControls(item);
    else html += '<div class="shrink-0 text-right rounded-xl bg-slate-50 border border-slate-200 px-3 py-2 min-w-[78px]"><div class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Expected</div><div class="font-display text-[24px] font-semibold leading-none mt-0.5 text-slate-900">' + esc(item.qty) + '</div>' + (item.unit ? '<div class="text-[10.5px] text-slate-500 mt-0.5">' + esc(item.unit) + '</div>' : '') + '<div class="mt-1.5 flex justify-end">' + statusPill(item.status) + '</div></div>';
    html += '</div></article>';
    if (item.changed) html += '<div class="px-3 pb-2 -mt-1 text-[11px] text-amber-800 flex items-center gap-1.5">' + icon('edit', 11) + ' Changed - ' + esc(item._orig.qty) + ' -> ' + esc(item.qty) + (item.status !== item._orig.status ? ' - ' + esc(item._orig.status) + ' -> ' + esc(item.status) : '') + '</div>';
    html += '</div>';
    return html;
  }

  function renderTechControls(item) {
    return '<div class="shrink-0 w-[160px] flex flex-col gap-2"><div><div class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold mb-1">Quantity</div>' +
      '<div class="flex items-center gap-1"><button data-action="dec-qty" data-row="' + esc(item.sheetRow) + '" class="tap rounded-lg border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 flex items-center justify-center">' + icon('minus', 16) + '</button>' +
      '<input data-action="qty" data-row="' + esc(item.sheetRow) + '" class="qty-input input flex-1 px-1" type="number" min="0" step="any" inputmode="decimal" value="' + esc(item.qty) + '"/>' +
      '<button data-action="inc-qty" data-row="' + esc(item.sheetRow) + '" class="tap rounded-lg border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 flex items-center justify-center">' + icon('plus', 16) + '</button></div><div class="mt-1 text-[10.5px] text-slate-500">Non-negative decimal allowed</div></div>' +
      '<div><div class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold mb-1">Status</div><select data-action="status" data-row="' + esc(item.sheetRow) + '" class="select py-2 text-[13px]">' +
      ['Good', 'Low Stock', 'Missing', 'Needs Maintenance'].map(function (status) {
        return '<option ' + (status === item.status ? 'selected' : '') + '>' + esc(status) + '</option>';
      }).join('') + '</select></div>' +
      '<button data-action="remove-item" data-row="' + esc(item.sheetRow) + '" class="rounded-lg border border-red-200 bg-red-50 px-2.5 py-2 text-[12px] font-semibold text-red-700 hover:bg-red-100 flex items-center justify-center gap-1.5">' + icon('warn', 13) + 'Remove</button></div>';
  }

  function renderAddItemForm() {
    var storageText = [
      route.loc && route.loc.room ? 'Room ' + route.loc.room : '',
      routeIdentity(route.loc) ? routeIdentityLabel(route.loc) + ' ' + routeIdentity(route.loc) : '',
      route.loc && route.loc.label ? route.loc.label : ''
    ].filter(Boolean).join(' - ');
    return '<div class="mx-4 mt-3 rounded-2xl border border-blue-200 bg-blue-50 p-3.5">' +
      '<div class="flex items-start justify-between gap-3"><div><div class="font-semibold text-blue-950 flex items-center gap-1.5">' + icon('plus', 14) + 'Add item to this storage</div><div class="text-[12px] text-blue-900/80 mt-0.5">This appends a new Inventory row using the current room and storage identity.</div></div><button data-action="cancel-add-item" class="tap rounded-lg hover:bg-blue-100 text-blue-800 px-2">Cancel</button></div>' +
      '<div class="mt-2 rounded-xl bg-white/70 border border-blue-100 px-3 py-2 text-[12px] text-blue-950"><span class="font-semibold">Current storage:</span> ' + esc(storageText || 'selected storage') + '</div>' +
      '<div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2">' +
      '<label class="text-[11px] font-semibold text-slate-600">Item name <span class="text-red-600">*</span><input id="newItemName" class="input mt-1" placeholder="e.g. Coping saw"/></label>' +
      '<label class="text-[11px] font-semibold text-slate-600">Item ID <input id="newItemId" class="input mt-1" placeholder="Optional; auto-generated if blank"/></label>' +
      '<label class="text-[11px] font-semibold text-slate-600">Quantity <span class="text-red-600">*</span><input id="newItemQty" class="input mt-1" type="number" min="0" step="any" inputmode="decimal" value="1"/></label>' +
      '<label class="text-[11px] font-semibold text-slate-600">Unit <input id="newItemUnit" class="input mt-1" placeholder="pcs, sets, bottles"/></label>' +
      '<label class="text-[11px] font-semibold text-slate-600">Category <span class="text-red-600">*</span><select id="newItemCategory" class="select mt-1"><option>Tools</option><option>Materials</option><option>Consumables</option><option>Electronics</option><option>Chemicals</option><option>Machine</option><option>Test</option><option>Other</option></select></label>' +
      '<label class="text-[11px] font-semibold text-slate-600">Status <select id="newItemStatus" class="select mt-1"><option>Good</option><option>Low Stock</option><option>Missing</option><option>Needs Maintenance</option></select></label>' +
      '<label class="text-[11px] font-semibold text-slate-600 sm:col-span-2">Remarks <input id="newItemRemarks" class="input mt-1" placeholder="Optional notes for this storage item"/></label>' +
      '</div><div class="mt-3 flex justify-end"><button data-action="submit-add-item" class="btn btn-success">' + icon('save', 14) + ' Add to Inventory</button></div></div>';
  }

  function renderSaveNotice() {
    if (saveState === 'idle') return '';
    var cls = saveState === 'saving' ? 'bg-blue-50 border border-blue-200 text-blue-900' : (saveState === 'saved' ? 'bg-emerald-50 border border-emerald-200 text-emerald-900' : 'bg-red-50 border border-red-200 text-red-900');
    var msg = saveState === 'saving' ? '<div class="w-3.5 h-3.5 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>Saving updates...' : (saveState === 'saved' ? icon('save', 15) + esc(saveMessage || 'Saved. Inventory rows updated in Google Sheets and audit metadata recorded where available.') : icon('warn', 15) + esc(saveError || 'Save failed. Check highlighted values, confirm you are on the deployed app, then retry.'));
    return '<div class="mx-4 mt-3 rounded-xl px-3 py-2.5 text-[12.5px] flex items-center gap-2 ' + cls + '">' + msg + '</div>';
  }

  function renderSaveBar() {
    var changed = localItems.filter(function (item) { return item.changed; }).length;
    return '<div class="save-bar"><div class="text-[12.5px] min-w-0">' +
      (changed ? '<div class="text-amber-800 font-semibold">' + changed + ' unsaved change' + (changed > 1 ? 's' : '') + '</div><div class="text-[11px] text-slate-500 mt-0.5">Changed rows only. Save writes to Inventory and Audit_Log.</div>' : '<div class="text-slate-600 font-medium">No changes yet</div><div class="text-[11px] text-slate-500 mt-0.5">Edit quantity/status, add an item, or remove an item from this storage.</div>') +
      '</div><button data-action="save" ' + (!changed || saveState === 'saving' ? 'disabled' : '') + ' class="btn ' + (changed ? 'btn-success' : 'btn-secondary opacity-60 cursor-not-allowed') + '">' + icon('save', 15) + ' Save updates</button></div>';
  }

  function renderEmptyLocation(loc, room) {
    return '<div class="min-h-full">' + renderContextStrip(loc, room) +
      '<div class="px-4 pt-8"><div class="card rounded-2xl p-6 text-center"><div class="mx-auto w-12 h-12 rounded-2xl bg-slate-100 text-slate-500 flex items-center justify-center">' + icon('box', 22) + '</div>' +
      '<h3 class="font-display text-[15px] font-semibold text-slate-900 mt-3">No items entered yet</h3><p class="text-[13px] text-slate-500 mt-1">No inventory items have been entered for this storage yet.</p></div></div></div>';
  }

  function renderAdmin() {
    var r = appData.readiness || emptyAppData().readiness;
    var mode = route.admin || 'readiness';
    var tabs = '<div class="px-4 pt-3 flex gap-2 overflow-x-auto no-scrollbar">' +
      adminTab('readiness', 'Readiness', mode) +
      adminTab('diagnostics', 'Diagnostics', mode) +
      '<button data-action="labels" class="room-tab">QR labels</button>' +
      '</div>';
    var html = topBar(mode === 'diagnostics' ? 'Admin - Diagnostics' : 'Admin - Readiness') + tabs + '<div class="px-4 pt-4 pb-8 space-y-4">';
    if (mode === 'diagnostics') {
      html += renderDiagnosticsPanel();
    } else {
      html += '<div class="card rounded-2xl p-4"><div class="text-[10.5px] font-semibold uppercase tracking-[0.18em] text-slate-500">Data Readiness</div><div class="font-display text-[36px] font-semibold leading-none text-slate-900 mt-1">' + esc(r.score) + '<span class="text-[18px] text-slate-400">/100</span></div><div class="text-[12.5px] text-slate-500 mt-1">' + esc(r.errors) + ' critical errors - ' + esc(r.warnings) + ' warnings</div></div>' +
        '<div class="pilot-gate ' + (Number(r.errors) ? 'is-blocked' : 'is-review') + '"><div class="font-semibold">' + (Number(r.errors) ? 'Rollout blocked by critical errors' : 'Pilot gate: critical errors clear') + '</div><div class="text-[12px] mt-1">' + (Number(r.errors) ? 'Fix critical errors in Inventory before QR printing or pilot use.' : 'Warnings still need owner decisions in Readiness_Warning_Triage before full rollout. Sample labels can proceed only after scan testing passes.') + '</div></div>' +
        '<div class="grid grid-cols-2 md:grid-cols-4 gap-2">' + issue(r.errors, 'Critical errors', 'red') + issue(r.warnings, 'Warnings', 'amber') + issue(r.missingQr, 'Missing QR links', 'amber') + issue(r.missingStorageId, '419A missing IDs', 'amber') + issue(r.invalidQty, 'Invalid qty', 'red') + issue(r.invalidStatus, 'Invalid status', 'red') + issue(r.duplicates, 'Duplicate items', 'amber') + issue((r.rollout419A && r.rollout419A.total) || 0, '419A storages', 'amber') + '</div>' +
        '<div class="card rounded-2xl p-4 text-[12.5px] text-slate-600"><div class="font-semibold text-slate-900 mb-2">Next actions</div><p>Run this from Google Sheet menu: D&amp;T Inventory - Create Readiness Report. Then use Readiness_Warning_Triage to assign warning owners and decisions. Print only sample QR labels until scans are verified.</p></div>';
      if (r.issueSample && r.issueSample.length) {
        html += '<div class="card rounded-2xl overflow-hidden"><div class="px-4 py-3 text-[12.5px] font-semibold text-slate-700 border-b border-slate-100">Issue sample</div>';
        r.issueSample.slice(0, 8).forEach(function (item) {
          html += '<div class="px-4 py-2.5 border-b border-slate-100 text-[12px]"><span class="font-semibold ' + (item.severity === 'ERROR' ? 'text-red-700' : 'text-amber-700') + '">' + esc(item.severity) + '</span> <span class="font-mono text-slate-500">row ' + esc(item.row || '-') + '</span> ' + esc(item.issue) + '<div class="text-slate-500 mt-0.5">' + esc(item.detail || '') + '</div></div>';
        });
        html += '</div>';
      }
    }
    html += '</div>';
    return html;
  }

  function adminTab(name, label, active) {
    return '<button data-action="admin-' + esc(name) + '" class="room-tab ' + (active === name ? 'is-active' : '') + '">' + esc(label) + '</button>';
  }

  function renderDiagnosticsPanel() {
    var raw = diagnostics.raw || {};
    var sheets = diagnostics.availableSheets || [];
    var html = '<div class="card rounded-2xl divide-y divide-slate-100"><div class="px-4 py-3 text-[12.5px] font-semibold text-slate-700">Configuration</div>' +
      diag(diagnostics.spreadsheetIdSet, 'SPREADSHEET_ID', (diagnostics.spreadsheetIdSource || '-') + ' ' + (diagnostics.spreadsheetMaskedId || '')) +
      diag(diagnostics.webAppBaseUrlSet, 'WEB_APP_BASE_URL', diagnostics.webAppBaseUrlSource || '-') +
      diag(diagnostics.sheetFound, 'Inventory sheet', diagnostics.sheetInUse || diagnostics.sheetError || '-') +
      diag(diagnostics.requiredColumnsOk, 'Required columns', diagnostics.requiredColumnsOk ? 'all present' : (diagnostics.missingRequiredColumns || []).join(', ')) +
      diag(!!diagnostics.qrImageColumn, 'QR Code Image', diagnostics.qrImageColumn ? 'present' : 'missing') +
      '</div>';
    if (raw.nextAction || diagnostics.nextAction) {
      html += '<div class="card rounded-2xl p-4 text-[12.5px] text-slate-700"><div class="font-semibold text-slate-900 mb-1">Admin action</div>' + esc(raw.nextAction || diagnostics.nextAction) + '</div>';
    }
    html += '<div class="card rounded-2xl overflow-hidden"><div class="px-4 py-3 text-[12.5px] font-semibold text-slate-700 border-b border-slate-100">Available sheets</div>';
    if (!sheets.length) html += '<div class="px-4 py-5 text-[13px] text-slate-500">No sheet list available. Check spreadsheet access.</div>';
    sheets.forEach(function (sheet) {
      html += '<div class="px-4 py-3 border-b border-slate-100 text-[12px]"><div class="flex items-center justify-between gap-3"><div class="font-semibold text-slate-900">' + esc(sheet.name) + '</div><span class="pill ' + (sheet.hasRequiredHeaders ? 'pill-good' : 'pill-low') + '">' + (sheet.hasRequiredHeaders ? 'inventory-ready' : 'missing headers') + '</span></div><div class="text-slate-500 mt-1">' + esc(sheet.rowCount) + ' data rows - missing: ' + esc((sheet.missingRequired || []).join(', ') || 'none') + '</div></div>';
    });
    html += '</div>';
    return html;
  }

  function issue(n, label, tone) {
    var cls = tone === 'red' ? 'text-red-700 bg-red-50 border-red-200' : 'text-amber-700 bg-amber-50 border-amber-200';

  function diag(ok, label, value) {

  }

  function renderLabels() {
    var labels = appData.locations || [];
    var html = topBar('QR Labels - print preview', '<button onclick="window.print()" class="btn btn-primary py-1.5 px-3 text-[12px] mr-2">' + icon('printer', 14) + ' Print</button>');

      html += '<div class="mx-4 mt-3 rounded-xl bg-amber-50 border border-amber-200 px-3 py-2.5 text-[12.5px] text-amber-900">WEB_APP_BASE_URL is not configured. Run this from Google Sheet menu: D&amp;T Inventory - Set WEB_APP_BASE_URL, then Refresh QR Links and Build QR Label Sheet.</div>';
    }

  function bindCurrentRoute() {
    root.querySelectorAll('[data-action]').forEach(function (el) {
      el.addEventListener('click', handleAction);
    });
    var search = document.getElementById('landingSearch');
    if (search) search.addEventListener('input', function () {
      route.q = search.value;
      render();
    });
    root.querySelectorAll('[data-room-tab]').forEach(function (el) {
      el.addEventListener('click', function () {
        route.room = el.getAttribute('data-room-tab') || 'All';
        render();
      });
    });
    var itemSearch = document.getElementById('itemSearch');
    if (itemSearch) itemSearch.addEventListener('input', function () {
      route.itemQ = itemSearch.value;
      render();
    });
    var statusFilter = document.getElementById('statusFilter');
    if (statusFilter) statusFilter.addEventListener('change', function () {
      route.status = statusFilter.value;
      render();
    });
    var categoryFilter = document.getElementById('categoryFilter');
    if (categoryFilter) categoryFilter.addEventListener('change', function () {
      route.category = categoryFilter.value;
      render();
    });
    root.querySelectorAll('[data-action="qty"]').forEach(function (input) {
      input.addEventListener('input', function () {
        var raw = input.value;
        var qty = raw === '' ? '' : Math.max(0, Number(raw));
        updateLocalItem(input.getAttribute('data-row'), { qty: qty }, false);
        refreshSaveBar();
      });
    });
    root.querySelectorAll('[data-action="status"]').forEach(function (select) {
      select.addEventListener('change', function () {
        updateLocalItem(select.getAttribute('data-row'), { status: select.value });
      });
    });
  }

  function handleAction(event) {
    var el = event.currentTarget;
    var action = el.getAttribute('data-action');
    if (action === 'labels') {
      updateUrl({ admin: 'labels' });
      setRoute({ name: 'labels' });
    } else if (action === 'storage') {
      updateUrl({ admin: 'storage' });
      setRoute({ name: 'storage', room: 'All' });
    } else if (action === 'audit') {
      updateUrl({ admin: 'audit' });
      setRoute({ name: 'audit' });
    } else if (action === 'lowstock') {
      updateUrl({ admin: 'lowstock' });
      setRoute({ name: 'lowstock' });
    } else if (action === 'maintenance') {
      updateUrl({ admin: 'maintenance' });
      setRoute({ name: 'maintenance' });
    } else if (action === 'admin') {
      updateUrl({ admin: 'readiness' });
      setRoute({ name: 'admin', admin: 'readiness' });
    } else if (action === 'admin-readiness' || action === 'admin-diagnostics') {
      var adminName = action.replace('admin-', '');
      updateUrl({ admin: adminName });
      setRoute({ name: 'admin', admin: adminName });
    }
    else if (action === 'back') goLanding();
    else if (action === 'toggle-mode') toggleMode();
    else if (action === 'open-add-item') {
      addFormOpen = true;
      render();
    } else if (action === 'cancel-add-item') {
      addFormOpen = false;
      render();
    } else if (action === 'submit-add-item') {
      addInventoryItem();
    } else if (action === 'remove-item') {
      removeInventoryItem(el.getAttribute('data-row'));
    }
    else if (action === 'view-location' || action === 'tech-location') {
      var loc = findLocationByKey(el.getAttribute('data-location-key'));
      if (loc) goLocation(loc, action === 'tech-location' ? 'tech' : 'view');
    } else if (action === 'inc-qty' || action === 'dec-qty') {
      var row = el.getAttribute('data-row');
      var item = findLocalItem(row);
      var next = Math.max(0, Number(item && item.qty || 0) + (action === 'inc-qty' ? 1 : -1));
      updateLocalItem(row, { qty: next }, true);
    } else if (action === 'save') {
      saveUpdates();
    }
  }

  function mapServerItem(r) {
    return {
      sheetRow: r.sheetRow,
      id: r.itemId,
      name: r.itemName,
      category: r.category,
      qty: r.qty,
      unit: r.unit,
      status: r.status,
      remarks: r.remarks,
      safetyNote: r.safetyNote,
      reorderLevel: r.reorderLevel,
      supplier: r.supplier,
      purchaseLink: r.purchaseLink,
      assetValue: r.assetValue,
      maintenanceDue: r.maintenanceDue,
      sdsLink: r.sdsLink,
      hazard: r.isHazard,
      _orig: { qty: r.qty, status: r.status },
      changed: false
    };
  }

  function applyServerRows(rows) {
    var mapped = (rows || []).map(mapServerItem);
    appData.items[route.loc.key] = mapped;
    localItems = mapped.map(function (item) {
      return Object.assign({}, item, { _orig: item._orig || { qty: item.qty, status: item.status } });
    });
    route.loc.itemCount = mapped.length;
    route.loc.items = route.loc.itemCount;
    route.loc.chemicalCount = mapped.filter(function (item) { return item.hazard; }).length;
    route.loc.attentionCount = mapped.filter(function (item) { return item.status !== 'Good'; }).length;
    route.loc.attention = route.loc.attentionCount;
    route.loc.hazard = route.loc.chemicalCount > 0;
  }

  function findLocalItem(row) {
    row = Number(row);
    return localItems.filter(function (item) { return Number(item.sheetRow) === row; })[0] || null;
  }

  function updateLocalItem(row, patch, rerender) {
    var item = findLocalItem(row);
    if (!item) return;
    Object.keys(patch).forEach(function (key) { item[key] = patch[key]; });
    item.changed = true;
    if (!appData.items[route.loc.key]) appData.items[route.loc.key] = [];
    appData.items[route.loc.key] = localItems;
    if (rerender !== false) render();
  }

  function refreshSaveBar() {
    var bar = root.querySelector('.save-bar');
    if (!bar) return;
    var changed = localItems.filter(function (item) { return item.changed; }).length;
    var text = bar.querySelector('.text-\\[12\\.5px\\]');
    var btn = bar.querySelector('[data-action="save"]');
    if (text) {
      text.innerHTML = changed
        ? '<span class="text-amber-800 font-semibold">' + changed + ' unsaved change' + (changed > 1 ? 's' : '') + '</span>'
        : '<span class="text-slate-500">No changes yet</span>';
    }
    if (btn) {
      btn.disabled = !changed || saveState === 'saving';
      btn.className = 'btn ' + (changed ? 'btn-success' : 'btn-secondary opacity-60 cursor-not-allowed');
      btn.innerHTML = icon('save', 15) + ' Save updates';
    }
  }

  function saveUpdates() {
    if (!(window.google && google.script && google.script.run)) {
      saveState = 'error';
      saveError = 'Save bridge unavailable. Open the deployed /exec URL to save.';
      render();
      return;
    }
    var updates = localItems.filter(function (item) { return item.changed; }).map(function (item) {
      return { sheetRow: item.sheetRow, qty: item.qty, status: item.status };
    });
    if (!updates.length) return;
    var invalid = updates.filter(function (item) {
      return item.qty === '' || !Number.isFinite(Number(item.qty)) || Number(item.qty) < 0;
    });
    if (invalid.length) {
      saveState = 'error';
      saveError = 'Enter a non-negative number for every changed quantity before saving.';
      render();
      return;
    }
    saveState = 'saving';
    saveError = '';
    render();
    google.script.run
      .withSuccessHandler(function (res) {
        applyServerRows((res && res.rows) || []);
        saveState = 'saved';
        saveMessage = 'Saved. Updated ' + ((res && res.updatedCount) || updates.length) + ' item(s) and recorded Audit_Log rows for actual changes.';
        render();
      })
      .withFailureHandler(function (err) {
        saveState = 'error';
        saveError = (err && err.message) || 'Save failed. Check values and retry.';
        render();
      })
      .saveInventoryUpdates({ room: route.loc.room, loc: route.loc.routeLoc || route.loc.id, updates: updates });
  }

  function addInventoryItem() {
    if (!(window.google && google.script && google.script.run)) {
      saveState = 'error';
      saveError = 'Save bridge unavailable. Open the deployed /exec URL to add items.';
      render();
      return;
    }
    var item = {
      itemId: textValue(document.getElementById('newItemId') && document.getElementById('newItemId').value),
      itemName: textValue(document.getElementById('newItemName') && document.getElementById('newItemName').value),
      qty: textValue(document.getElementById('newItemQty') && document.getElementById('newItemQty').value),
      unit: textValue(document.getElementById('newItemUnit') && document.getElementById('newItemUnit').value),
      category: textValue(document.getElementById('newItemCategory') && document.getElementById('newItemCategory').value),
      status: textValue(document.getElementById('newItemStatus') && document.getElementById('newItemStatus').value),
      remarks: textValue(document.getElementById('newItemRemarks') && document.getElementById('newItemRemarks').value)
    };
    if (!item.itemName) {
      saveState = 'error';
      saveError = 'Enter an item name before adding it to Inventory.';
      addFormOpen = true;
      render();
      return;
    }
    if (item.qty === '' || !Number.isFinite(Number(item.qty)) || Number(item.qty) < 0) {
      saveState = 'error';
      saveError = 'Enter a non-negative quantity before adding the item.';
      addFormOpen = true;
      render();
      return;
    }
    saveState = 'saving';
    saveError = '';
    saveMessage = '';
    render();
    google.script.run
      .withSuccessHandler(function (res) {
        applyServerRows((res && res.rows) || []);
        addFormOpen = false;
        saveState = 'saved';
        saveMessage = 'Item added to this storage and recorded in Audit_Log.';
        render();
      })
      .withFailureHandler(function (err) {
        addFormOpen = true;
        saveState = 'error';
        saveError = (err && err.message) || 'Add item failed. Check the fields and retry.';
        render();
      })
      .addInventoryItemToLocation({ room: route.loc.room, loc: route.loc.routeLoc || route.loc.id, item: item });
  }

  function removeInventoryItem(row) {
    var item = findLocalItem(row);
    if (!item) return;
    var storageText = [
      route.loc && route.loc.room ? 'Room ' + route.loc.room : '',
      routeIdentity(route.loc) ? routeIdentityLabel(route.loc) + ' ' + routeIdentity(route.loc) : '',
      route.loc && route.loc.label ? route.loc.label : ''
    ].filter(Boolean).join(' - ');
    var warning = localItems.length <= 1 ? '\n\nThis is the last visible item in this storage. The system will preserve the storage route with a placeholder row after removal.' : '';
    var ok = window.confirm([
      'Remove this item from Inventory?',
      '',
      'Item: ' + (item.name || '-'),
      'Item ID: ' + (item.id || '-'),
      'Storage: ' + (storageText || 'selected storage'),
      'Current quantity: ' + (item.qty || '0') + (item.unit ? ' ' + item.unit : ''),
      '',
      'This deletes the Inventory row and records REMOVE in Audit_Log.' + warning,
      '',
      'Continue only if you are physically checking this storage.'
    ].join('\n'));
    if (!ok) return;
    if (!(window.google && google.script && google.script.run)) {
      saveState = 'error';
      saveError = 'Save bridge unavailable. Open the deployed /exec URL to remove items.';
      render();
      return;
    }
    saveState = 'saving';
    saveError = '';
    saveMessage = '';
    render();
    google.script.run
      .withSuccessHandler(function (res) {
        applyServerRows((res && res.rows) || []);
        saveState = 'saved';
        saveMessage = 'Item removed from this storage and recorded in Audit_Log.';
        render();
      })
      .withFailureHandler(function (err) {
        saveState = 'error';
        saveError = (err && err.message) || 'Remove item failed. Refresh and retry.';
        render();
      })
      .removeInventoryItemFromLocation({ room: route.loc.room, loc: route.loc.routeLoc || route.loc.id, sheetRow: Number(row) });
  }

  try {
    render();
  } catch (err) {
    if (root) {
      root.innerHTML = '<div class="app-shell"><div class="px-4 py-6"><div class="rounded-2xl border border-red-200 bg-red-50 p-4 text-red-900"><div class="font-semibold">App failed to render</div><div class="mt-1 text-sm">' + esc(err && err.message ? err.message : err) + '</div></div></div></div>';
    }
  }
})();
</script>
