          '<div class="mt-2 flex flex-wrap gap-1.5 items-center">' + statusPill(item.status) + (sdsHref ? '<a class="pill pill-blue hover:underline" target="_blank" rel="noopener noreferrer" href="' + esc(sdsHref) + '">' + icon('external', 10) + 'SDS</a>' : (item.sdsLink ? '<span class="pill pill-low">SDS link blocked</span>' : '<span class="pill pill-low">SDS missing</span>')) + '</div>' +
          '</div></div></article>';
      });
      html += '</div>';
    }
    html += '</section></div>';
    return html;
  }

  function renderError() {
    var title = route.message || 'Configuration error';
    if (route.kind === 'no-match') title = 'No matching storage location';
    return topBar('Diagnostics') + '<div class="px-4 pt-4 pb-8 space-y-3"><div class="rounded-2xl border border-red-200 bg-red-50 text-red-900 p-4"><div class="flex items-start gap-3">' + icon('warn', 20, 'shrink-0 mt-0.5') + '<div><h3 class="font-display text-[15px] font-semibold">' + esc(title) + '</h3><p class="text-[13px] mt-1 opacity-90">' + esc(route.message || 'Open the Google Sheet menu and run Config Status / Diagnostics.') + '</p></div></div></div></div>';
  }

  function topBar(title, right) {
    return '<div class="topbar px-2 py-2 bg-white border-b border-slate-200 flex items-center gap-1 sticky top-0 z-10"><button data-action="back" class="tap rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-700">' + icon('arrow-left', 20) + '</button><div class="topbar-title flex-1 text-[13.5px] font-semibold text-slate-900 truncate">' + esc(title) + '</div>' + scannerActionHtml('tap rounded-lg hover:bg-blue-50 flex items-center justify-center text-blue-700', icon('scan', 18), 'Scan QR') + (right || '') + '</div>';
  }

  function renderScannerDiagnostics() {
    var diag = scannerState.diagnostics || collectScannerDiagnostics();
    var rows = [
      ['Secure context', diag.secureContext ? 'yes' : 'no'],
      ['Apps Script frame', diag.framed ? 'yes' : 'no'],
      ['mediaDevices', diag.mediaDevices ? 'available' : 'missing'],
      ['getUserMedia', diag.getUserMedia ? 'available' : 'missing'],
      ['camera permission', scannerState.permissionState || diag.permissionState || 'not checked'],
      ['platform', diag.platform || '-'],
      ['user agent', diag.userAgent || '-']
    ];
    if (scannerState.lastCameraError) rows.splice(4, 0, ['last camera error', scannerState.lastCameraError]);
    return '<details class="scanner-diagnostics"><summary>Camera diagnostics</summary>' +
      '<div class="scanner-diagnostics-grid">' + rows.map(function (row) {
        return '<div><strong>' + esc(row[0]) + '</strong><span>' + esc(row[1]) + '</span></div>';
      }).join('') + '</div></details>';
  }

  function renderScannerRoomOptions() {
    var rooms = (appData.rooms || []).map(function (room) { return room.code; }).filter(Boolean);
    if (rooms.indexOf('419A') === -1) rooms.unshift('419A');
    var selected = scannerState.manualRoom || (route.loc && route.loc.room) || '419A';
    var html = '<option value="">Choose room...</option>';
    rooms.forEach(function (room) {
      html += '<option value="' + esc(room) + '"' + (room === selected ? ' selected' : '') + '>' + esc(room) + '</option>';
    });
    return html;
  }

  function collectScannerDiagnostics() {
    var nav = window.navigator || {};
    return {
      secureContext: !!window.isSecureContext,
      framed: isFramedApp(),
      mediaDevices: !!nav.mediaDevices,
      getUserMedia: !!(nav.mediaDevices && nav.mediaDevices.getUserMedia),
      permissionState: scannerState.permissionState || '',
      platform: nav.platform || '',
      userAgent: nav.userAgent || ''
    };
  }

  function refreshCameraPermissionState() {
    scannerState.diagnostics = collectScannerDiagnostics();
    if (!(navigator.permissions && navigator.permissions.query)) {
      scannerState.permissionState = 'unsupported';
      return;
    }
    try {
      navigator.permissions.query({ name: 'camera' }).then(function (status) {
        scannerState.permissionState = status && status.state ? status.state : 'unknown';
        scannerState.diagnostics = collectScannerDiagnostics();
        updateScannerStatus();
        var details = root && root.querySelector('.scanner-diagnostics');
        if (details) {
          details.outerHTML = renderScannerDiagnostics();
        }
      }).catch(function (err) {
        scannerState.permissionState = 'unavailable' + (err && err.name ? ' (' + err.name + ')' : '');
      });
    } catch (err) {
      scannerState.permissionState = 'unavailable' + (err && err.name ? ' (' + err.name + ')' : '');
    }
  }

  function renderScannerOverlay() {
    var framed = isFramedApp();
    var externalScanner = !!configuredExternalScannerUrl();
    var suggestions = (scannerState.suggestions || []).map(function (loc) {
      return '<button data-action="scanner-suggestion" data-location-key="' + esc(loc.key) + '" class="scanner-suggestion">' +
        '<strong>' + esc(routeIdentity(loc) || loc.label) + '</strong><span>' + esc(loc.room + ' - ' + loc.label) + '</span></button>';
    }).join('');
    var cameraOverlay = scannerState.stream ? '' :
      '<div class="scanner-camera-prompt"><div class="scanner-camera-title">QR scanner</div>' +
      '<div class="scanner-camera-copy">' + (externalScanner ? 'Camera permission is requested in the standalone HTTPS scanner, outside the Apps Script frame. It scans the QR and returns here in View Mode.' : (framed ? 'This scanner is inside the Apps Script frame, which can block camera permission. Open the full-screen scanner first, then allow camera access there.' : 'This full-screen scanner can request camera access directly. Tap Start camera and allow permission.')) + '</div>' +
      ((framed || externalScanner) ? '<button data-action="scanner-open-standalone" class="scanner-camera-start is-fullscreen">' + icon('external', 18) + (externalScanner ? ' Open camera scanner' : ' Open full-screen camera scanner') + '</button>' : '') +
      (!externalScanner ? '<button data-action="scanner-start-camera" class="scanner-camera-start' + (framed ? ' is-secondary' : '') + '">' + icon('scan', 18) + (framed ? ' Try camera here' : ' Start camera') + '</button>' : '') +
      '<label class="scanner-camera-upload">' + icon('scan', 18) + ' Take QR photo<input id="scannerCameraInput" type="file" accept="image/*" capture="environment"/></label></div>';
    var standaloneHelp = scannerState.standaloneUrl ?
      '<div class="scanner-standalone-link">If the scanner did not open, use this link:<a href="' + esc(scannerState.standaloneUrl) + '" target="_top" rel="noopener noreferrer">Open camera scanner</a><span>' + esc(scannerState.standaloneUrl) + '</span></div>' : '';
    return '<div class="scanner-overlay" role="dialog" aria-modal="true" aria-label="QR scanner">' +
      '<div class="scanner-sheet">' +
      '<div class="scanner-header"><div><div class="text-[10.5px] font-semibold uppercase tracking-[0.18em] text-blue-700">D&amp;T Inventory</div><h2 class="font-display text-[18px] font-semibold text-slate-900">Scan storage QR</h2></div><button data-action="close-scanner" class="tap rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center">' + icon('minus', 18) + '</button></div>' +
      '<div class="scanner-camera"><video id="scannerVideo" autoplay muted playsinline></video><canvas id="scannerCanvas" class="hidden"></canvas><div class="scanner-reticle"></div>' + cameraOverlay + '</div>' +
      '<div class="scanner-status ' + (scannerState.error ? 'is-error' : '') + '">' + (scannerState.error ? icon('warn', 14) + esc(scannerState.error) : icon('scan', 14) + esc(scannerState.message || 'Take a QR photo, paste a QR URL, or enter room/location. QR opens View Mode by default.')) + '</div>' +
      standaloneHelp +
      '<div class="scanner-native-tip">' + icon('info', 15) + '<span>If the in-app camera is blocked, use the phone Camera app to scan the printed QR label and open the /exec link directly. You can also paste the QR URL or enter room/location below.</span></div>' +
      '<div class="scanner-fallback"><label>Paste QR URL or enter Location Code<input id="scannerManualInput" class="input mt-1" value="' + esc(scannerState.manual || '') + '" placeholder="419A-FCU-01 or /exec?room=419A&amp;loc=..."/></label>' +
      '<div class="scanner-manual-grid mt-2"><label>Room<select id="scannerRoomInput" class="select mt-1">' + renderScannerRoomOptions() + '</select></label><label>Location / storage code<input id="scannerLocationInput" class="input mt-1" value="' + esc(scannerState.manualLoc || '') + '" placeholder="419A-FCU-01"/></label></div>' +
      '<div class="grid grid-cols-2 gap-2 mt-2"><button data-action="scanner-open-view" class="btn btn-primary">' + icon('search', 14) + ' Open View</button><button data-action="scanner-open-update" class="btn btn-secondary">' + icon('edit', 14) + ' Open Update</button></div>' +
      '<label class="scanner-upload">Upload QR image / screenshot<input id="scannerImageInput" type="file" accept="image/*" capture="environment"/></label>' +
      (scannerState.imageDecodeMessage ? '<div class="scanner-image-message">' + esc(scannerState.imageDecodeMessage) + '</div>' : '') +
      '<div class="scanner-suggestions">' + (suggestions ? '<div class="text-[11px] font-semibold text-slate-500 uppercase tracking-[0.14em]">Suggestions</div>' + suggestions : '') + '</div>' +
      renderScannerDiagnostics() +
      '</div></div></div>';
  }

  function openScanner() {
    if (configuredExternalScannerUrl()) {
      var opened = openStandaloneScanner({ sameTab: true });
      if (opened) return;
    }
    scannerState.open = true;
    scannerState.error = scannerState.error || '';
    scannerState.message = scannerState.error
      ? ''
      : 'Take a QR photo, paste a QR URL, or enter room/location below.';
    scannerState.suggestions = [];
    scannerState.imageDecodeMessage = '';
    scannerState.standaloneUrl = scannerState.standaloneUrl || '';
    scannerState.diagnostics = collectScannerDiagnostics();
    refreshCameraPermissionState();
    render();
  }

  function stopScanner() {
    if (scannerState.raf) {
      cancelAnimationFrame(scannerState.raf);
      scannerState.raf = 0;
    }
    if (scannerState.stream) {
      scannerState.stream.getTracks().forEach(function (track) { track.stop(); });
    scannerState.stream = null;
    }
    scannerState.starting = false;
    scannerState.cameraRequested = false;
  }

  function closeScanner() {
    stopScanner();
    scannerState.open = false;
    scannerState.error = '';
    scannerState.message = '';
    scannerState.suggestions = [];
    scannerState.imageDecodeMessage = '';
    scannerState.cameraRequested = false;
    scannerState.standaloneUrl = '';
  }

  function startScanner() {
    if (scannerState.starting || scannerState.stream) return;
    scannerState.diagnostics = collectScannerDiagnostics();
    refreshCameraPermissionState();
    var video = document.getElementById('scannerVideo');
    if (!video || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
      scannerState.lastCameraError = 'mediaDevices/getUserMedia unavailable';
      scannerState.error = 'Camera scanning is blocked in this browser or Apps Script frame. You can still open QR labels directly, paste a QR URL, or enter the room/location manually.';
      updateScannerStatus();
      return;
    }
    if (!window.isSecureContext) {
      scannerState.lastCameraError = 'insecure context';
      scannerState.error = 'Camera requires a secure HTTPS page. Open the deployed /exec link directly, paste the QR URL, or enter room/location manually.';
      updateScannerStatus();
      return;
    }
    scannerState.cameraRequested = true;
    scannerState.starting = true;
    scannerState.message = 'Requesting camera permission...';
    scannerState.error = '';
    updateScannerStatus();
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false })
      .then(function (stream) {
        scannerState.stream = stream;
        scannerState.starting = false;
        video.srcObject = stream;
        scannerState.message = 'Scanning...';
        scannerState.error = '';
        var prompt = root && root.querySelector('.scanner-camera-prompt');
        if (prompt) prompt.remove();
        updateScannerStatus();
        return video.play();
      })
      .then(function () {
        scanFrame();
      })
      .catch(function (err) {
        scannerState.starting = false;
        var name = err && err.name ? err.name : '';
        var message = err && err.message ? err.message : '';
        scannerState.lastCameraError = (name || 'CameraError') + (message ? ': ' + message : '');
        if (name === 'NotAllowedError' || name === 'SecurityError') {
          scannerState.error = 'Camera scanning is blocked in this browser or Apps Script frame. You can still open QR labels directly, paste a QR URL, or enter the room/location manually.';
        } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
          scannerState.error = 'No camera was found on this device. Enter a Location Code or paste a QR URL below.';
        } else if (name === 'NotReadableError') {
          scannerState.error = 'The camera is already in use or could not be read. Close other camera apps, paste the QR URL, or enter room/location manually.';
        } else if (name === 'OverconstrainedError') {
          scannerState.error = 'This browser could not match the requested camera settings. Try the native Camera app, paste the QR URL, or enter room/location manually.';
        } else {
          scannerState.error = 'Camera could not start here. This can happen inside the Apps Script frame. Paste a QR URL, enter room/location, or scan the printed label with the phone Camera app.';
        }
        scannerState.diagnostics = collectScannerDiagnostics();
        updateScannerStatus();
      });
  }

  function updateScannerStatus() {
    var status = root && root.querySelector('.scanner-status');
    if (!status) return;
    status.className = 'scanner-status ' + (scannerState.error ? 'is-error' : '');
    status.innerHTML = (scannerState.error ? icon('warn', 14) + esc(scannerState.error) : icon('scan', 14) + esc(scannerState.message || 'Scanning...'));
  }

  function scanFrame() {
    var video = document.getElementById('scannerVideo');
    if (!scannerState.open || !video || !scannerState.stream) return;
    if ('BarcodeDetector' in window) {
      try {
        if (!scannerState.detector) scannerState.detector = new BarcodeDetector({ formats: ['qr_code'] });
        scannerState.detector.detect(video).then(function (codes) {
          if (codes && codes.length) return handleScanText(codes[0].rawValue || '');
          scannerState.raf = requestAnimationFrame(scanFrame);
        }).catch(function () {
          scanWithJsQr(video);
        });
        return;
      } catch (err) {
        scanWithJsQr(video);
        return;
      }
    }
    scanWithJsQr(video);
  }

  function scanWithJsQr(video) {
    ensureJsQr(function () {
      var canvas = document.getElementById('scannerCanvas');
      if (!canvas || !window.jsQR || !video.videoWidth || !video.videoHeight) {
        scannerState.raf = requestAnimationFrame(scanFrame);
        return;
      }
      var size = Math.min(video.videoWidth, video.videoHeight);
      var sx = Math.max(0, Math.floor((video.videoWidth - size) / 2));
      var sy = Math.max(0, Math.floor((video.videoHeight - size) / 2));
      canvas.width = size;
      canvas.height = size;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, sx, sy, size, size, 0, 0, size, size);
      var image = ctx.getImageData(0, 0, size, size);
      var code = window.jsQR(image.data, image.width, image.height);
      if (code && code.data) return handleScanText(code.data);
      scannerState.raf = requestAnimationFrame(scanFrame);
    }, function () {
      scannerState.error = 'Camera is open, but QR decoding is unavailable. Enter a Location Code or paste a QR URL below.';
      updateScannerStatus();
    });
  }

  function ensureJsQr(done, fail) {
    if (window.jsQR) return done();
    if (document.getElementById('jsqrLoader')) {
      setTimeout(function () { ensureJsQr(done, fail); }, 250);
      return;
    }
    var script = document.createElement('script');
    script.id = 'jsqrLoader';
    script.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
    script.onload = done;
    script.onerror = fail;
    document.head.appendChild(script);
  }

  function handleScannerImageUpload(file) {
    if (!file) return;
    scannerState.imageDecodeMessage = 'Reading QR image...';
    updateScannerImageMessage();
    ensureJsQr(function () {
      var reader = new FileReader();
      reader.onload = function () {
        var image = new Image();
        image.onload = function () {
          try {
            var canvas = document.createElement('canvas');
            var max = 1400;
            var scale = Math.min(1, max / Math.max(image.width, image.height));
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));
            var ctx = canvas.getContext('2d');
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
            var data = ctx.getImageData(0, 0, canvas.width, canvas.height);
            var code = window.jsQR(data.data, data.width, data.height);
            if (code && code.data) {
              scannerState.imageDecodeMessage = 'QR image decoded. Opening View Mode...';
              updateScannerImageMessage();
              handleScanText(code.data);
              return;
            }
            scannerState.imageDecodeMessage = 'No QR code found in that image. Try a clearer screenshot or paste the QR URL.';
            updateScannerImageMessage();
          } catch (err) {
            scannerState.imageDecodeMessage = 'Could not decode that QR image. Paste the QR URL or enter room/location manually.';
            updateScannerImageMessage();
          }
        };
        image.onerror = function () {
          scannerState.imageDecodeMessage = 'Could not read that image file.';
          updateScannerImageMessage();
        };
        image.src = reader.result;
      };
      reader.onerror = function () {
        scannerState.imageDecodeMessage = 'Could not read that image file.';
        updateScannerImageMessage();
      };
      reader.readAsDataURL(file);
    }, function () {
      scannerState.imageDecodeMessage = 'QR image upload needs the jsQR decoder, but it could not load. Paste the QR URL instead.';
      updateScannerImageMessage();
    });
  }

  function updateScannerImageMessage() {
    var el = root && root.querySelector('.scanner-image-message');
    if (el) {
      el.textContent = scannerState.imageDecodeMessage || '';
      return;
    }
    var upload = root && root.querySelector('.scanner-upload');
    if (upload && scannerState.imageDecodeMessage) {
      upload.insertAdjacentHTML('afterend', '<div class="scanner-image-message">' + esc(scannerState.imageDecodeMessage) + '</div>');
    }
  }

  function handleScanText(text) {
    var resolved = resolveScanInput(text);
    if (!resolved.loc) {
      scannerState.manual = textValue(text);
      scannerState.error = resolved.error || 'QR was read, but no matching storage was found. Check the code below.';
      scannerState.suggestions = findScanSuggestions(text);
      render();
      return;
    }
    scannerState.message = 'Opening ' + (routeIdentity(resolved.loc) || resolved.loc.label) + '...';
    updateScannerStatus();
    setTimeout(function () {
      goLocation(resolved.loc, 'view');
    }, 180);
  }

  function openManualScan(mode) {
    var input = document.getElementById('scannerManualInput');
    var roomInput = document.getElementById('scannerRoomInput');
    var locInput = document.getElementById('scannerLocationInput');
    var raw = textValue(input && input.value);
    var manualRoom = textValue(roomInput && roomInput.value);
    var manualLoc = textValue(locInput && locInput.value);
    scannerState.manual = raw;
    scannerState.manualRoom = manualRoom;
    scannerState.manualLoc = manualLoc;
    var resolved = resolveScanInput(raw || (manualRoom && manualLoc ? manualRoom + ' ' + manualLoc : ''), manualRoom, manualLoc);
    if (!resolved.loc) {
      scannerState.error = resolved.error || (raw || manualLoc ? 'No matching storage. Choose a suggestion or check the Location Code.' : 'Enter a Location Code, room/location, or paste a QR URL.');
      scannerState.suggestions = findScanSuggestions(raw || manualLoc || manualRoom);
      render();
      return;
    }
    navigateToStorageRoute(resolved.loc.room, routeIdentity(resolved.loc), { mode: mode === 'tech' ? 'tech' : 'view' });
  }

  function resolveScanInput(raw, manualRoom, manualLoc) {
    var text = textValue(raw);
    if (manualRoom && manualLoc) {
      return { loc: findLocationByRoomLoc(manualRoom, manualLoc), error: 'No matching storage for that room/location.' };
    }
    if (!text) return { loc: null };
    var parsedRoute = parseInventoryQrUrl(text);
    if (parsedRoute.error) return { loc: null, error: parsedRoute.error };
    if (parsedRoute.room && parsedRoute.loc) {
      return {
        loc: findLocationByRoomLoc(parsedRoute.room, parsedRoute.loc),
        error: 'QR URL is valid, but no matching storage exists in the current Inventory data.'
      };
    }
    var exact = findLocationByAnyIdentity(text);
    if (exact) return { loc: exact };
    var suggestions = findScanSuggestions(text);
    return { loc: suggestions.length === 1 ? suggestions[0] : null };
  }

  function parseInventoryQrUrl(input) {
    var text = textValue(input);
    if (!text) return { room: '', loc: '', modeStripped: false, error: '' };
    var params = null;
    var parsed = null;
    var relative = false;
    if (/^[?]/.test(text)) {
      params = new URLSearchParams(text.slice(1));
      relative = true;
    } else if (/^(room|loc|mode)=/i.test(text)) {
      params = new URLSearchParams(text);
      relative = true;
    } else if (/^\/?exec\?/i.test(text)) {
      var rel = text.charAt(0) === '/' ? text : '/' + text;
      parsed = new URL(rel, textValue(BOOT.webAppBaseUrl) || 'https://inventory.local');
      params = parsed.searchParams;
      relative = true;
    } else if (hasUrlScheme(text) || /^\/\//.test(text)) {
      if (/^\/\//.test(text)) {
        return { room: '', loc: '', modeStripped: false, error: "Protocol-relative QR URLs are not allowed. Paste this app's /exec link or enter room/location manually." };
      }
      try {
        parsed = new URL(text);
      } catch (err) {
        return { room: '', loc: '', modeStripped: false, error: 'QR URL is malformed. Paste the full /exec link or enter the Location Code manually.' };
      }
      if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
        return { room: '', loc: '', modeStripped: false, error: 'Unsupported QR URL scheme. Only http and https QR links are allowed.' };
      }
      if (!isAllowedInventoryUrl(parsed)) {
        return { room: '', loc: '', modeStripped: false, error: 'This QR URL is not from this D&T Inventory deployment. Enter the Location Code manually if needed.' };
      }
      params = parsed.searchParams;
    }
    if (!params) return { room: '', loc: '', modeStripped: false, error: '' };
    var clean = stripUnsafeMode(params);
    var room = clean.room;
    var loc = clean.loc;
    var modeStripped = clean.modeStripped;
    if (!room || !loc) {
      return { room: '', loc: '', modeStripped: modeStripped, error: relative ? 'QR route is missing room or location.' : '' };
    }
    return { room: room, loc: loc, modeStripped: modeStripped, error: '' };
  }

  function navigateToStorageRoute(room, locText, options) {
    var loc = findLocationByRoomLoc(room, locText);
    if (!loc) {
      scannerState.error = 'No matching storage for ' + room + ' / ' + locText + '.';
      scannerState.suggestions = findScanSuggestions(locText || room);
      render();
      return false;
    }
    goLocation(loc, options && options.mode === 'tech' ? 'tech' : 'view');
    return true;
  }

  function normScan(value) {
    var raw = String(value == null ? '' : value).replace(/\+/g, '%2B');
    try {
      return decodeURIComponent(raw).trim().toLowerCase().replace(/\s+/g, ' ');
    } catch (err) {
      return String(value == null ? '' : value).trim().toLowerCase().replace(/\s+/g, ' ');
    }
  }

  function findLocationByRoomLoc(room, locText) {
    var roomNorm = normScan(room);
    var locNorm = normScan(locText);
    return (appData.locations || []).filter(function (loc) {
      if (normScan(loc.room) !== roomNorm) return false;
      return locationIdentityValues(loc).some(function (value) { return normScan(value) === locNorm; });
    })[0] || null;
  }

  function findLocationByAnyIdentity(raw) {
    var n = normScan(raw);
    return (appData.locations || []).filter(function (loc) {
      return locationIdentityValues(loc).some(function (value) { return normScan(value) === n; });
    })[0] || null;
  }

  function locationIdentityValues(loc) {
    return [loc.routeLoc, loc.id, loc.code, loc.storageId, loc.storageLabel, loc.label, loc.specific].filter(Boolean);
  }

  function findScanSuggestions(raw) {
    var n = normScan(raw);
    if (!n) return [];
    return (appData.locations || []).filter(function (loc) {
      return [
        loc.searchText,
        loc.routeLoc,
        loc.id,
        loc.code,
        loc.storageId,
        loc.storageLabel,
        loc.label,
        loc.specific,
        loc.room
      ].filter(Boolean).join(' ').toLowerCase().indexOf(n) !== -1;
    }).slice(0, 5);
  }

  function bindCurrentRoute() {
    root.querySelectorAll('[data-action]').forEach(function (el) {
      el.addEventListener('click', handleAction);
    });
    var search = document.getElementById('landingSearch');
    if (search) search.addEventListener('input', function () {
      route.q = search.value;
      render();
    });
    root.querySelectorAll('[data-room-tab]').forEach(function (el) {
      el.addEventListener('click', function () {
        route.room = el.getAttribute('data-room-tab') || 'All';
        render();
      });
    });
    var itemSearch = document.getElementById('itemSearch');
    if (itemSearch) itemSearch.addEventListener('input', function () {
      route.itemQ = itemSearch.value;
      render();
    });
    var statusFilter = document.getElementById('statusFilter');
    if (statusFilter) statusFilter.addEventListener('change', function () {
      route.status = statusFilter.value;
      render();
    });
    var categoryFilter = document.getElementById('categoryFilter');
    if (categoryFilter) categoryFilter.addEventListener('change', function () {
      route.category = categoryFilter.value;
      render();
    });
    var scannerManualInput = document.getElementById('scannerManualInput');
    if (scannerManualInput) scannerManualInput.addEventListener('input', function () {
      scannerState.manual = scannerManualInput.value;
      scannerState.suggestions = findScanSuggestions(scannerManualInput.value);
      var wrap = root.querySelector('.scanner-suggestions');
      if (wrap) {
        var suggestions = scannerState.suggestions.map(function (loc) {
          return '<button data-action="scanner-suggestion" data-location-key="' + esc(loc.key) + '" class="scanner-suggestion"><strong>' + esc(routeIdentity(loc) || loc.label) + '</strong><span>' + esc(loc.room + ' - ' + loc.label) + '</span></button>';
        }).join('');
        wrap.innerHTML = suggestions ? '<div class="text-[11px] font-semibold text-slate-500 uppercase tracking-[0.14em]">Suggestions</div>' + suggestions : '';
        wrap.querySelectorAll('[data-action="scanner-suggestion"]').forEach(function (el) { el.addEventListener('click', handleAction); });
      }
    });
    var scannerRoomInput = document.getElementById('scannerRoomInput');
    if (scannerRoomInput) scannerRoomInput.addEventListener('change', function () {
      scannerState.manualRoom = scannerRoomInput.value;
    });
    var scannerLocationInput = document.getElementById('scannerLocationInput');
    if (scannerLocationInput) scannerLocationInput.addEventListener('input', function () {
      scannerState.manualLoc = scannerLocationInput.value;
      scannerState.suggestions = findScanSuggestions(scannerLocationInput.value);
      var wrap = root.querySelector('.scanner-suggestions');
      if (wrap) {
        var suggestions = scannerState.suggestions.map(function (loc) {
          return '<button data-action="scanner-suggestion" data-location-key="' + esc(loc.key) + '" class="scanner-suggestion"><strong>' + esc(routeIdentity(loc) || loc.label) + '</strong><span>' + esc(loc.room + ' - ' + loc.label) + '</span></button>';
        }).join('');
        wrap.innerHTML = suggestions ? '<div class="text-[11px] font-semibold text-slate-500 uppercase tracking-[0.14em]">Suggestions</div>' + suggestions : '';
        wrap.querySelectorAll('[data-action="scanner-suggestion"]').forEach(function (el) { el.addEventListener('click', handleAction); });
      }
    });
    var scannerImageInput = document.getElementById('scannerImageInput');
    if (scannerImageInput) scannerImageInput.addEventListener('change', function () {
      handleScannerImageUpload(scannerImageInput.files && scannerImageInput.files[0]);
      scannerImageInput.value = '';
    });
    var scannerCameraInput = document.getElementById('scannerCameraInput');
    if (scannerCameraInput) scannerCameraInput.addEventListener('change', function () {
      handleScannerImageUpload(scannerCameraInput.files && scannerCameraInput.files[0]);
      scannerCameraInput.value = '';
    });
    root.querySelectorAll('[data-action="qty"]').forEach(function (input) {
      input.addEventListener('input', function () {
        var raw = input.value;
        var qty = raw === '' ? '' : Math.max(0, Number(raw));
        updateLocalItem(input.getAttribute('data-row'), { qty: qty }, false);
        refreshSaveBar();
      });
    });
    root.querySelectorAll('[data-action="status"]').forEach(function (select) {
      select.addEventListener('change', function () {
        updateLocalItem(select.getAttribute('data-row'), { status: select.value });
      });
    });
  }

  function handleAction(event) {
    var el = event.currentTarget;
    var action = el.getAttribute('data-action');
    if (action === 'open-scanner') {
      openScanner();
    } else if (action === 'scanner-open-standalone') {
      openStandaloneScanner({ sameTab: true });
    } else if (action === 'scanner-start-camera') {
      startScanner();
    } else if (action === 'close-scanner') {
      closeScanner();
      render();
    } else if (action === 'scanner-open-view') {
      openManualScan('view');
    } else if (action === 'scanner-open-update') {
      openManualScan('tech');
    } else if (action === 'scanner-suggestion') {
      var scanLoc = findLocationByKey(el.getAttribute('data-location-key'));
      if (scanLoc) goLocation(scanLoc, 'view');
    } else if (action === 'focus-search') {
      var landingSearch = document.getElementById('landingSearch');
      if (landingSearch) landingSearch.focus();
    } else if (action === 'toggle-tools') {
      toolsOpen = !toolsOpen;
      render();
    } else if (action === 'labels') {
      updateUrl({ admin: 'labels' });
      setRoute({ name: 'labels' });
    } else if (action === 'label-printer-preset') {
      setLabelPrintPreset(el.getAttribute('data-printer-preset') || 'standard');
    } else if (action === 'label-print-one') {
      setLabelPrintTarget(el.getAttribute('data-label-key') || '', true);
    } else if (action === 'label-preview-selected' || action === 'label-print-selected') {
      var labelSelect = document.getElementById('labelPrintSelect');
      setLabelPrintTarget(labelSelect ? labelSelect.value : '', action === 'label-print-selected');
    } else if (action === 'label-print-all') {
      setLabelPrintTarget('', false);
    } else if (action === 'storage') {
      updateUrl({ admin: 'storage' });
      setRoute({ name: 'storage', room: 'All' });
    } else if (action === 'audit') {
      updateUrl({ admin: 'audit' });
      setRoute({ name: 'audit' });
    } else if (action === 'lowstock') {
      updateUrl({ admin: 'lowstock' });
      setRoute({ name: 'lowstock' });
    } else if (action === 'maintenance') {
      updateUrl({ admin: 'maintenance' });
      setRoute({ name: 'maintenance' });
    } else if (action === 'admin') {
      updateUrl({ admin: 'readiness' });
      setRoute({ name: 'admin', admin: 'readiness' });
    } else if (action === 'admin-readiness' || action === 'admin-diagnostics' || action === 'admin-scanner') {
      var adminName = action.replace('admin-', '');
      updateUrl({ admin: adminName });
      setRoute({ name: 'admin', admin: adminName });
    } else if (action === 'scanner-copy-report') {
      copyScannerEvidenceReport();
    }
    else if (action === 'back') goLanding();
    else if (action === 'toggle-mode') toggleMode();
    else if (action === 'unlock-update') authorizeUpdateModeClient();
    else if (action === 'open-add-item') {
      if (!isUpdateUnlocked()) {
        saveState = 'error';
        saveError = 'Unlock Update Mode before adding items.';
        render();
        return;
      }
      addFormOpen = true;
      render();
    } else if (action === 'cancel-add-item') {
      addFormOpen = false;
      render();
    } else if (action === 'submit-add-item') {
      addInventoryItem();
    } else if (action === 'remove-item') {
      removeInventoryItem(el.getAttribute('data-row'));
    }
    else if (action === 'view-location' || action === 'tech-location') {
      var loc = findLocationByKey(el.getAttribute('data-location-key'));
      if (loc) goLocation(loc, action === 'tech-location' ? 'tech' : 'view');
    } else if (action === 'inc-qty' || action === 'dec-qty') {
      var row = el.getAttribute('data-row');
      var item = findLocalItem(row);
      var next = Math.max(0, Number(item && item.qty || 0) + (action === 'inc-qty' ? 1 : -1));
      updateLocalItem(row, { qty: next }, true);
    } else if (action === 'save') {
      saveUpdates();
    }
  }

  function authorizeUpdateModeClient() {
    if (!(window.google && google.script && google.script.run)) {
      saveState = 'error';
      saveError = 'Update unlock is available only from the deployed Apps Script /exec URL.';
      render();
      return;
    }
    var pinInput = document.getElementById('updateAuthPin');
    var pin = textValue(pinInput && pinInput.value);
    saveState = 'saving';
    saveError = '';
    saveMessage = '';
    render();
    google.script.run
      .withSuccessHandler(function (res) {
        updateAuthToken = textValue(res && res.token);
        writeSessionValue(UPDATE_AUTH_STORAGE_KEY, updateAuthToken);
        if (res && res.updateAuth) BOOT.updateAuth = res.updateAuth;
        saveState = 'saved';
        saveMessage = (res && res.message) || 'Update Mode unlocked.';
        render();
      })
      .withFailureHandler(function (err) {
        updateAuthToken = '';
        writeSessionValue(UPDATE_AUTH_STORAGE_KEY, '');
        saveState = 'error';
        saveError = (err && err.message) || 'Update unlock failed.';
        render();
      })
      .authorizeUpdateMode(pin);
  }

  function expectedItemIdentity(item) {
    return {
      itemId: item && item.id,
      itemName: item && item.name,
      category: item && item.category,
      expectedQty: item && item._orig ? item._orig.qty : item && item.qty,
      expectedStatus: item && item._orig ? item._orig.status : item && item.status,
      specificLocation: item && item.specificLocation,
      storageId: item && item.storageId,
      storageLabel: item && item.storageLabel,
      locationCode: item && item.locationCode
    };
  }

  function mapServerItem(r) {
    return {
      sheetRow: r.sheetRow,
      id: r.itemId,
      name: r.itemName,
      category: r.category,
      qty: r.qty,
      unit: r.unit,
      status: r.status,
      remarks: r.remarks,
      safetyNote: r.safetyNote,
      reorderLevel: r.reorderLevel,
      supplier: r.supplier,
      purchaseLink: r.purchaseLink,
      assetValue: r.assetValue,
      maintenanceDue: r.maintenanceDue,
      sdsLink: r.sdsLink,
      specificLocation: r.specificLocation,
      storageId: r.storageId,
      storageLabel: r.storageLabel,
      locationCode: r.locationCode,
      hazard: r.isHazard,
      _orig: { qty: r.qty, status: r.status },
      changed: false
    };
  }

  function applyServerRows(rows) {
    var mapped = (rows || []).map(mapServerItem);
    appData.items[route.loc.key] = mapped;
    localItems = mapped.map(function (item) {
      return Object.assign({}, item, { _orig: item._orig || { qty: item.qty, status: item.status } });
    });
    route.loc.itemCount = mapped.length;
    route.loc.items = route.loc.itemCount;
    route.loc.chemicalCount = mapped.filter(function (item) { return item.hazard; }).length;
    route.loc.attentionCount = mapped.filter(function (item) { return item.status !== 'Good'; }).length;
    route.loc.attention = route.loc.attentionCount;
    route.loc.hazard = route.loc.chemicalCount > 0;
  }

  function findLocalItem(row) {
    row = Number(row);
    return localItems.filter(function (item) { return Number(item.sheetRow) === row; })[0] || null;
  }

  function updateLocalItem(row, patch, rerender) {
    var item = findLocalItem(row);
    if (!item) return;
    Object.keys(patch).forEach(function (key) { item[key] = patch[key]; });
    item.changed = true;
    if (!appData.items[route.loc.key]) appData.items[route.loc.key] = [];
    appData.items[route.loc.key] = localItems;
    if (rerender !== false) render();
  }

  function refreshSaveBar() {
    var bar = root.querySelector('.save-bar');
    if (!bar) return;
    var changed = localItems.filter(function (item) { return item.changed; }).length;
    var text = bar.querySelector('.text-\\[12\\.5px\\]');
    var btn = bar.querySelector('[data-action="save"]');
    if (text) {
      text.innerHTML = changed
        ? '<span class="text-amber-800 font-semibold">' + changed + ' unsaved change' + (changed > 1 ? 's' : '') + '</span>'
        : '<span class="text-slate-500">No changes yet</span>';
    }
    if (btn) {
      btn.disabled = !changed || saveState === 'saving';
      btn.className = 'btn ' + (changed ? 'btn-success' : 'btn-secondary opacity-60 cursor-not-allowed');
      btn.innerHTML = icon('save', 15) + ' Save updates';
    }
  }

  function saveUpdates() {
    if (!isUpdateUnlocked()) {
      saveState = 'error';
      saveError = 'Unlock Update Mode before saving live inventory changes.';
      render();
      return;
    }
    if (!(window.google && google.script && google.script.run)) {
      saveState = 'error';
      saveError = 'Save bridge unavailable. Open the deployed /exec URL to save.';
      render();
      return;
    }
    var updates = localItems.filter(function (item) { return item.changed; }).map(function (item) {
      return Object.assign({
        sheetRow: item.sheetRow,
        qty: item.qty,
        status: item.status
      }, expectedItemIdentity(item));
    });
    if (!updates.length) return;
    var invalid = updates.filter(function (item) {
      return item.qty === '' || !Number.isFinite(Number(item.qty)) || Number(item.qty) < 0;
    });
    if (invalid.length) {
      saveState = 'error';
      saveError = 'Enter a non-negative number for every changed quantity before saving.';
      render();
      return;
    }
    saveState = 'saving';
    saveError = '';
    render();
    google.script.run
      .withSuccessHandler(function (res) {
        applyServerRows((res && res.rows) || []);
        saveState = 'saved';
        saveMessage = 'Saved. Updated ' + ((res && res.updatedCount) || updates.length) + ' item(s) and recorded Audit_Log rows for actual changes.';
        render();
      })
      .withFailureHandler(function (err) {
        saveState = 'error';
        saveError = (err && err.message) || 'Save failed. Check values and retry.';
        render();
      })
      .saveInventoryUpdates(Object.assign({ room: route.loc.room, loc: route.loc.routeLoc || route.loc.id, updates: updates }, updateAuthPayload()));
  }

  function addInventoryItem() {
    if (!isUpdateUnlocked()) {
      saveState = 'error';
      saveError = 'Unlock Update Mode before adding items.';
      render();
      return;
    }
    if (!(window.google && google.script && google.script.run)) {
      saveState = 'error';
      saveError = 'Save bridge unavailable. Open the deployed /exec URL to add items.';
      render();
      return;
    }
    var item = {
      itemId: textValue(document.getElementById('newItemId') && document.getElementById('newItemId').value),
      itemName: textValue(document.getElementById('newItemName') && document.getElementById('newItemName').value),
      qty: textValue(document.getElementById('newItemQty') && document.getElementById('newItemQty').value),
      unit: textValue(document.getElementById('newItemUnit') && document.getElementById('newItemUnit').value),
      category: textValue(document.getElementById('newItemCategory') && document.getElementById('newItemCategory').value),
      status: textValue(document.getElementById('newItemStatus') && document.getElementById('newItemStatus').value),
      remarks: textValue(document.getElementById('newItemRemarks') && document.getElementById('newItemRemarks').value)
    };
    if (!item.itemName) {
      saveState = 'error';
      saveError = 'Enter an item name before adding it to Inventory.';
      addFormOpen = true;
      render();
      return;
    }
    if (item.qty === '' || !Number.isFinite(Number(item.qty)) || Number(item.qty) < 0) {
      saveState = 'error';
      saveError = 'Enter a non-negative quantity before adding the item.';
      addFormOpen = true;
      render();
      return;
    }
    saveState = 'saving';
    saveError = '';
    saveMessage = '';
    render();
    google.script.run
      .withSuccessHandler(function (res) {
        applyServerRows((res && res.rows) || []);
        addFormOpen = false;
        saveState = 'saved';
        saveMessage = 'Item added to this storage and recorded in Audit_Log.';
        render();
      })
      .withFailureHandler(function (err) {
        addFormOpen = true;
        saveState = 'error';
        saveError = (err && err.message) || 'Add item failed. Check the fields and retry.';
        render();
      })
      .addInventoryItemToLocation(Object.assign({ room: route.loc.room, loc: route.loc.routeLoc || route.loc.id, item: item }, updateAuthPayload()));
  }

  function removeInventoryItem(row) {
    if (!isUpdateUnlocked()) {
      saveState = 'error';
      saveError = 'Unlock Update Mode before removing items.';
      render();
      return;
    }
    var item = findLocalItem(row);
    if (!item) return;
    var storageText = [
      route.loc && route.loc.room ? 'Room ' + route.loc.room : '',
      routeIdentity(route.loc) ? routeIdentityLabel(route.loc) + ' ' + routeIdentity(route.loc) : '',
      route.loc && route.loc.label ? route.loc.label : ''
    ].filter(Boolean).join(' - ');
    var warning = localItems.length <= 1 ? '\n\nThis is the last visible item in this storage. The system will preserve the storage route with a placeholder row after removal.' : '';
    var ok = window.confirm([
      'Remove this item from Inventory?',
      '',
      'Item: ' + (item.name || '-'),
      'Item ID: ' + (item.id || '-'),
      'Storage: ' + (storageText || 'selected storage'),
      'Current quantity: ' + (item.qty || '0') + (item.unit ? ' ' + item.unit : ''),
      '',
      'This deletes the Inventory row and records REMOVE in Audit_Log.' + warning,
      '',
      'Continue only if you are physically checking this storage.'
    ].join('\n'));
    if (!ok) return;
    if (!(window.google && google.script && google.script.run)) {
      saveState = 'error';
      saveError = 'Save bridge unavailable. Open the deployed /exec URL to remove items.';
      render();
      return;
    }
    saveState = 'saving';
    saveError = '';
    saveMessage = '';
    render();
    google.script.run
      .withSuccessHandler(function (res) {
        applyServerRows((res && res.rows) || []);
        saveState = 'saved';
        saveMessage = 'Item removed from this storage and recorded in Audit_Log.';
        render();
      })
      .withFailureHandler(function (err) {
        saveState = 'error';
        saveError = (err && err.message) || 'Remove item failed. Refresh and retry.';
        render();
      })
      .removeInventoryItemFromLocation(Object.assign({ room: route.loc.room, loc: route.loc.routeLoc || route.loc.id, sheetRow: Number(row) }, expectedItemIdentity(item), updateAuthPayload()));
  }

  try {
    if (shouldAutoOpenScanner()) {
      if (configuredExternalScannerUrl() && openStandaloneScanner({ sameTab: true })) {
        return;
      }
      scannerState.open = true;
      scannerState.error = configuredExternalScannerUrl()
        ? 'Could not open the standalone camera scanner. Paste a QR URL, upload a QR image, or enter the room/location manually.'
        : '';
      scannerState.message = configuredExternalScannerUrl()
        ? 'Manual scanner fallback is ready. QR inputs still open View Mode by default.'
        : (isFramedApp()
          ? 'This scanner is inside an Apps Script frame and camera access may be blocked. Use manual entry or QR image upload if Start camera fails.'
          : 'Full-screen scanner is ready. Tap Start camera and allow camera permission.');
      scannerState.suggestions = [];
      scannerState.imageDecodeMessage = '';
      scannerState.diagnostics = collectScannerDiagnostics();
    }
    render();
    if (scannerState.open) refreshCameraPermissionState();
  } catch (err) {
    if (root) {
      root.innerHTML = '<div class="app-shell"><div class="px-4 py-6"><div class="rounded-2xl border border-red-200 bg-red-50 p-4 text-red-900"><div class="font-semibold">App failed to render</div><div class="mt-1 text-sm">' + esc(err && err.message ? err.message : err) + '</div></div></div></div>';
    }
  }
})();
</script>
