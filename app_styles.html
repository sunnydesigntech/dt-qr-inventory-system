<style>
/* D&T QR Inventory — design tokens (Victoria Shanghai Academy / clean institutional) */
:root {
  --vsa-ink: #0b1220;
  --vsa-ink-2: #1f2937;
  --vsa-muted: #64748b;
  --vsa-line: #e2e8f0;
  --vsa-line-soft: #eef2f6;
  --vsa-bg: #f6f7f9;
  --vsa-surface: #ffffff;
  --vsa-surface-2: #f8fafc;

  --vsa-blue: #1d4ed8;
  --vsa-blue-2: #2563eb;
  --vsa-blue-soft: #eef4ff;
  --vsa-teal: #0f766e;
  --vsa-teal-soft: #ecfdf5;

  --vsa-good: #047857;
  --vsa-good-soft: #ecfdf5;
  --vsa-low: #b45309;
  --vsa-low-soft: #fffbeb;
  --vsa-miss: #b91c1c;
  --vsa-miss-soft: #fef2f2;
  --vsa-maint: #c2410c;
  --vsa-maint-soft: #fff7ed;
  --vsa-hazard: #991b1b;
  --vsa-hazard-soft: #fee2e2;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 22px;
  --shadow-card: 0 1px 0 rgba(15,23,42,0.04), 0 6px 18px -8px rgba(15,23,42,0.10);
  --shadow-pop: 0 18px 45px -12px rgba(15,23,42,0.18);
  --dash-bg: #fafafb;
  --dash-primary: #605bff;
  --dash-primary-soft: #f0f0ff;
  --dash-cyan: #26c0e2;
  --dash-card-shadow: 0 16px 24px rgba(15,23,42,0.06), 0 2px 6px rgba(15,23,42,0.04), 0 0 1px rgba(15,23,42,0.08);
  --dash-card-shadow-soft: 0 10px 24px -18px rgba(15,23,42,0.34);

  --mobile-title: 24px;
  --mobile-section: 19px;
  --mobile-card-title: 18px;
  --mobile-body: 16px;
  --mobile-meta: 14.5px;
  --mobile-caption: 13.5px;
  --mobile-pill: 13.5px;
  --mobile-button: 15.5px;
  --mobile-code: 15px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  background:
    radial-gradient(circle at 92% -8%, rgba(96,91,255,.10), transparent 28%),
    radial-gradient(circle at -6% 12%, rgba(38,192,226,.10), transparent 24%),
    var(--dash-bg);
  color: var(--vsa-ink);
  min-height: 100%;
  overflow-x: hidden;
}
body {
  font-family: 'Inter Tight', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-feature-settings: 'cv11','ss01','ss03';
  -webkit-font-smoothing: antialiased;
  min-width: 320px;
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}
.font-display { font-family: 'Inter Tight', 'Inter', system-ui, sans-serif; letter-spacing: -0.01em; }
.font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

.dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
.dot-good { background: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.18); }
.dot-low  { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.18); }
.dot-miss { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.18); }
.dot-maint{ background: #f97316; box-shadow: 0 0 0 3px rgba(249,115,22,0.18); }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; line-height: 1; }
.pill-good  { background: var(--vsa-good-soft); color: var(--vsa-good); }
.pill-low   { background: var(--vsa-low-soft);  color: var(--vsa-low); }
.pill-miss  { background: var(--vsa-miss-soft); color: var(--vsa-miss); }
.pill-maint { background: var(--vsa-maint-soft);color: var(--vsa-maint); }
.pill-hazard{ background: var(--vsa-hazard-soft);color: var(--vsa-hazard); }
.pill-neutral{ background:#f1f5f9; color:#334155; }
.pill-blue  { background: var(--vsa-blue-soft); color: var(--vsa-blue); }
.pill-teal  { background: var(--vsa-teal-soft); color: var(--vsa-teal); }

.card {
  background: var(--vsa-surface);
  border: 1px solid rgba(226,232,240,.92);
  border-radius: var(--r-lg);
  box-shadow: var(--dash-card-shadow-soft);
}
.card-flat {
  background: var(--vsa-surface);
  border: 1px solid rgba(226,232,240,.92);
  box-shadow: var(--dash-card-shadow-soft);
}
.divider { border-top: 1px solid var(--vsa-line); }

.hazard-stripe { box-shadow: inset 4px 0 0 var(--vsa-hazard); }
.hazard-band { background: linear-gradient(180deg, #fef2f2, #fff); }

.mode-tech-bg { background: linear-gradient(180deg,#fffaeb 0%, #fff 240px); }

.route-principle {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  border: 1px solid rgba(96,91,255,.16);
  background: linear-gradient(135deg, #f5f7ff 0%, #ffffff 82%);
  border-radius: 20px;
  padding: 14px;
  box-shadow: var(--dash-card-shadow-soft);
}
.route-principle-icon {
  width: 38px;
  height: 38px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--dash-primary), var(--vsa-blue));
  color: white;
  flex-shrink: 0;
  box-shadow: 0 10px 22px -14px rgba(96,91,255,.85);
}
.route-example {
  display: inline-flex;
  max-width: 100%;
  margin-top: 8px;
  padding: 4px 7px;
  border-radius: 8px;
  background: #0b1220;
  color: white;
  font: 600 10.5px/1.35 'JetBrains Mono', ui-monospace, monospace;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.desktop-hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(320px, .65fr);
  gap: 12px;
  align-items: stretch;
}

.quick-action-card {
  background: linear-gradient(135deg, #ffffff 0%, #f7f9ff 100%);
  border: 1px solid rgba(96,91,255,.14);
  border-radius: 20px;
  padding: 14px;
  box-shadow: var(--dash-card-shadow-soft);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
}

.quick-action-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.quick-action-btn {
  min-height: 42px;
  border-radius: 14px;
  border: 1px solid rgba(203,213,225,.86);
  background: rgba(255,255,255,.84);
  color: #334155;
  font-size: 12.5px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  box-shadow: 0 8px 18px -18px rgba(15,23,42,.7);
  transition: transform .14s ease, border-color .14s ease, background .14s ease, color .14s ease;
}
.quick-action-btn:hover {
  transform: translateY(-1px);
  border-color: rgba(96,91,255,.28);
  background: #ffffff;
  color: var(--dash-primary);
}

.metric-card {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr);
  gap: 12px;
  align-items: center;
  padding: 13px 14px;
  min-height: 92px;
}
.metric-card.metric-rollout {
  border-color: rgba(15,118,110,.20);
  background: linear-gradient(135deg, #ecfdf5 0%, #f7fffb 100%);
}
.metric-icon {
  width: 42px;
  height: 42px;
  border-radius: 15px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--dash-primary);
  background: var(--dash-primary-soft);
  border: 1px solid rgba(96,91,255,.12);
}
.metric-icon.is-rollout {
  color: #0f766e;
  background: #dffbf0;
  border-color: rgba(15,118,110,.14);
}
.metric-icon.is-hazard {
  color: #b91c1c;
  background: #fee2e2;
  border-color: rgba(185,28,28,.12);
}
.metric-icon.is-warning {
  color: #b45309;
  background: #fffbeb;
  border-color: rgba(180,83,9,.14);
}
.metric-label {
  color: #64748b;
}
.metric-value {
  color: #0f172a;
}
.metric-rollout .metric-label,
.metric-rollout .metric-value {
  color: #0f766e;
}

.identity-card {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
  border-radius: 10px;
  border: 1px solid rgba(96,91,255,.22);
  background: linear-gradient(135deg, #f1f5ff, #ffffff);
  padding: 5px 8px;
}
.identity-card span {
  color: var(--dash-primary);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .11em;
  text-transform: uppercase;
  white-space: nowrap;
}
.identity-card strong {
  color: #0f172a;
  font: 700 12px/1.1 'JetBrains Mono', ui-monospace, monospace;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.route-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
  border-radius: 999px;
  background: linear-gradient(135deg, #111827, #312e81);
  color: white;
  padding: 5px 10px;
  box-shadow: 0 12px 26px -20px rgba(15,23,42,.7);
}
.route-badge span {
  color: #bfdbfe;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.route-badge strong {
  color: white;
  font: 700 11px/1 'JetBrains Mono', ui-monospace, monospace;
}
.update-mode-note {
  border: 1px solid rgba(251,191,36,.45);
  background: linear-gradient(135deg, #fff8e1 0%, #ffffff 100%);
  border-radius: 18px;
  padding: 13px 14px;
  box-shadow: var(--dash-card-shadow-soft);
}
.hazard-callout {
  border: 1px solid rgba(248,113,113,.38);
  background: linear-gradient(135deg, #fef2f2 0%, #fff 100%);
  border-radius: 18px;
  padding: 13px 14px;
  box-shadow: inset 4px 0 0 var(--vsa-hazard);
}
.pilot-gate {
  border-radius: 18px;
  border: 1px solid;
  padding: 13px 14px;
  font-size: 13px;
}
.pilot-gate.is-review {
  border-color: #fcd34d;
  background: #fffbeb;
  color: #78350f;
}
.pilot-gate.is-blocked {
  border-color: #fecaca;
  background: #fef2f2;
  color: #7f1d1d;
}

.qr-glyph {
  background-image:
    linear-gradient(45deg, #0b1220 25%, transparent 25%),
    linear-gradient(-45deg, #0b1220 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #0b1220 75%),
    linear-gradient(-45deg, transparent 75%, #0b1220 75%);
  background-size: 12px 12px;
  background-position: 0 0, 0 6px, 6px -6px, -6px 0;
}

.seg { display: inline-flex; padding: 4px; background:#eef2ff; border-radius: 999px; border: 1px solid rgba(96,91,255,.12); }
.seg button { padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; color:#475569; }
.seg button.is-active { background: white; color: var(--dash-primary); box-shadow: var(--dash-card-shadow-soft); }

.save-bar {
  position: sticky; bottom: 0; left:0; right:0;
  background: linear-gradient(180deg, rgba(255,255,255,0.7), #fff 30%);
  border-top: 1px solid var(--vsa-line);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  display: flex; gap: 10px; align-items: center; justify-content: space-between;
  backdrop-filter: blur(8px);
  z-index: 5;
}

.row-changed { background: #fffbeb; box-shadow: inset 3px 0 0 #f59e0b; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:600; border-radius: 12px; padding: 10px 14px; font-size: 14px; transition: all .12s ease; min-height: 44px; }
.btn-primary { background: linear-gradient(135deg, var(--dash-primary), var(--vsa-blue)); color: white; box-shadow: 0 14px 26px -20px rgba(96,91,255,.9); }
.btn-primary:hover { filter: brightness(.98); }
.btn-secondary { background: white; color: var(--vsa-ink); border: 1px solid var(--vsa-line); }
.btn-secondary:hover { background: var(--vsa-surface-2); }
.btn-ghost { background: transparent; color: var(--vsa-ink-2); }
.btn-ghost:hover { background: var(--vsa-surface-2); }
.btn-danger { background: var(--vsa-miss); color: white; }
.btn-success { background: var(--vsa-good); color: white; }
.btn-success:hover { background: #065f46; }

.input, .select { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 14px; border: 1px solid rgba(203,213,225,.92); background: white; font-size: 15px; box-shadow: inset 0 1px 0 rgba(15,23,42,.02); }
.input:focus, .select:focus { outline: none; border-color: var(--vsa-blue); box-shadow: 0 0 0 3px rgba(29,78,216,0.15); }
.qty-input { font-feature-settings: 'tnum'; font-variant-numeric: tabular-nums; font-weight: 600; text-align: center; font-size: 18px; }

.tap { min-height: 44px; min-width: 44px; }

.room-tab { padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; color:#475569; background: white; border: 1px solid rgba(226,232,240,.95); white-space: nowrap; box-shadow: 0 8px 18px -18px rgba(15,23,42,.45); }
.room-tab.is-active { background: #111827; color: white; border-color: #111827; }
.room-tab.rollout { border-color: var(--vsa-teal); color: var(--vsa-teal); background: var(--vsa-teal-soft); }
.room-tab.rollout.is-active { background: var(--vsa-teal); color: white; }

.gauge { transform: rotate(-90deg); }
.gauge circle { fill: none; stroke-width: 10; stroke-linecap: round; }

.skel { background: linear-gradient(90deg, #f1f5f9 0%, #e2e8f0 50%, #f1f5f9 100%); background-size: 200% 100%; animation: skel 1.4s infinite; border-radius: 8px; }
@keyframes skel { 0%{background-position: 200% 0;} 100%{background-position: -200% 0;} }

.topbar {
  padding-top: max(8px, env(safe-area-inset-top));
  min-height: calc(48px + env(safe-area-inset-top));
}
.topbar-title { min-width: 0; }

.label-sheet { background: white; border: 1px solid rgba(226,232,240,.95); box-shadow: var(--dash-card-shadow-soft); }
.qr-label { border: 1.5px dashed #cbd5e1; padding: 14px; display: flex; gap: 14px; align-items: center; border-radius: 14px; background: linear-gradient(180deg, #fff, #fbfdff); }
.label-print-stage.is-brother-stage {
  padding: 16px 16px 34px;
  overflow-x: auto;
}
.label-sheet.is-brother {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  width: max-content;
  min-width: 102mm;
  gap: 10px;
  padding: 12px;
  background: #f8fafc;
}
.label-sheet.is-brother .label-preview-item {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
}
.label-sheet.is-brother-slim .label-preview-item {
  width: 90mm;
}
.label-sheet.is-brother-compact .label-preview-item {
  width: 102mm;
}
.label-sheet.is-brother-safety .label-preview-item {
  width: 102mm;
}
.brother-ql-label {
  box-sizing: border-box;
  width: 102mm;
  min-height: 70mm;
  border: 1px solid #111827;
  border-radius: 0;
  background: #fff;
  color: #111827;
  display: block;
  padding: 5mm;
  box-shadow: 0 12px 26px rgba(15,23,42,.10);
}
.label-sheet.is-brother-compact .brother-ql-label {
  min-height: 50mm;
  padding: 4mm;
}
.label-sheet.is-brother-slim {
  min-width: 90mm;
}
.label-sheet.is-brother-slim .brother-ql-label {
  width: 76mm;
  min-height: 22mm;
  height: 22mm;
  margin: 3.5mm 7mm;
  padding: .9mm 1.1mm;
  overflow: hidden;
}
.brother-ql-label.is-hazard {
  border-width: 2px;
  border-color: #b91c1c;
}
.brother-label-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 30mm;
  gap: 4mm;
  align-items: start;
}
.label-sheet.is-brother-compact .brother-label-body {
  grid-template-columns: minmax(0, 1fr) 27mm;
  gap: 3mm;
}
.label-sheet.is-brother-slim .brother-label-body {
  grid-template-columns: minmax(0, 1fr) 16mm;
  gap: 1.4mm;
}
.brother-label-brand {
  font-size: 10pt;
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: .08em;
  color: #071f4d;
  text-transform: uppercase;
}
.brother-label-room {
  margin-top: 2mm;
  font-size: 11pt;
  line-height: 1.15;
  font-weight: 700;
  color: #334155;
}
.brother-label-code {
  margin-top: 1mm;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  font-size: 19pt;
  line-height: 1.05;
  font-weight: 900;
  color: #111827;
}
.label-sheet.is-brother-compact .brother-label-code {
  font-size: 17pt;
}
.label-sheet.is-brother-slim .brother-label-brand {
  font-size: 5.1pt;
  line-height: 1;
  letter-spacing: .025em;
}
.label-sheet.is-brother-slim .brother-label-room {
  display: inline-block;
  margin-top: .45mm;
  font-size: 6.1pt;
  line-height: 1;
}
.label-sheet.is-brother-slim .brother-label-code {
  margin-top: .25mm;
  font-size: 9.7pt;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brother-label-title {
  margin-top: 1.5mm;
  font-size: 12pt;
  line-height: 1.15;
  font-weight: 800;
}
.brother-label-subtitle {
  margin-top: .7mm;
  font-size: 9.5pt;
  line-height: 1.2;
  font-weight: 600;
  color: #475569;
}
.brother-label-scan {
  margin-top: 3mm;
  font-size: 10.5pt;
  line-height: 1.1;
  font-weight: 900;
}
.brother-label-hazard {
  margin-top: 2mm;
  padding: 1.4mm 1.8mm;
  border: 1px solid #b91c1c;
  background: #fee2e2;
  color: #991b1b;
  font-size: 9pt;
  line-height: 1.1;
  font-weight: 900;
}
.label-sheet.is-brother-slim .brother-label-title {
  margin-top: .35mm;
  font-size: 6.2pt;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.label-sheet.is-brother-slim .brother-label-subtitle,
.label-sheet.is-brother-slim .brother-label-url {
  display: none;
}
.label-sheet.is-brother-slim .brother-label-scan {
  margin-top: .45mm;
  font-size: 5.9pt;
  line-height: 1;
}
.label-sheet.is-brother-slim .brother-label-hazard {
  margin-top: .35mm;
  padding: .25mm .45mm;
  font-size: 4.6pt;
  line-height: 1;
}
.brother-label-qr {
  width: 30mm;
  height: 30mm;
  border: 1px solid #111827;
  padding: 1.5mm;
  background: #fff;
}
.label-sheet.is-brother-compact .brother-label-qr {
  width: 27mm;
  height: 27mm;
}
.label-sheet.is-brother-slim .brother-label-qr {
  box-sizing: border-box;
  width: 16mm;
  height: 16mm;
  padding: .35mm;
}
.brother-label-qr img,
.brother-label-qr .qr-glyph {
  width: 100%;
  height: 100%;
  display: block;
}
.brother-label-url {
  margin-top: 2mm;
  max-width: 92mm;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 6.5pt;
  line-height: 1.15;
  color: #64748b;
}
.label-single-actions {
  margin-top: 10px;
}
.brother-ql-label .label-single-actions {
  margin-top: 2mm;
}
.label-sheet.is-brother-slim .label-single-actions {
  margin-top: 1mm;
}
.label-sheet.is-brother .label-single-actions {
  margin-top: 0;
  padding-left: 0;
}
.storage-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
.desktop-only { display: none; }

.mobile-app-header {
  padding-top: max(12px, env(safe-area-inset-top));
  background: rgba(255,255,255,.94);
  backdrop-filter: blur(14px);
  box-shadow: 0 10px 22px -22px rgba(15,23,42,.55);
}

.mobile-scan-panel {
  border: 1px solid rgba(96,91,255,.18);
  background: linear-gradient(135deg, #f4f6ff 0%, #ffffff 100%);
  border-radius: 20px;
  padding: 12px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  box-shadow: var(--dash-card-shadow-soft);
}
.scan-primary-btn,
.scan-secondary-btn,
.workshop-tools-toggle {
  min-height: 48px;
  border-radius: 14px;
  font-weight: 700;
}
.scan-primary-btn {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: linear-gradient(135deg, var(--dash-primary), var(--vsa-blue));
  color: white;
  text-align: left;
  box-shadow: 0 16px 28px -20px rgba(96,91,255,.95);
}
.scan-primary-btn small {
  display: block;
  font-size: 11px;
  font-weight: 600;
  opacity: .82;
  margin-top: 1px;
}
.scan-secondary-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 10px 12px;
  background: white;
  color: var(--dash-primary);
  border: 1px solid rgba(96,91,255,.22);
}

.scanner-overlay {
