<style>
/* D&T QR Inventory — design tokens (Victoria Shanghai Academy / clean institutional) */
:root {
  --vsa-ink: #0b1220;
  --vsa-ink-2: #1f2937;
  --vsa-muted: #64748b;
  --vsa-line: #e2e8f0;
  --vsa-line-soft: #eef2f6;
  --vsa-bg: #f6f7f9;
  --vsa-surface: #ffffff;
  --vsa-surface-2: #f8fafc;

  --vsa-blue: #1d4ed8;
  --vsa-blue-2: #2563eb;
  --vsa-blue-soft: #eef4ff;
  --vsa-teal: #0f766e;
  --vsa-teal-soft: #ecfdf5;

  --vsa-good: #047857;
  --vsa-good-soft: #ecfdf5;
  --vsa-low: #b45309;
  --vsa-low-soft: #fffbeb;
  --vsa-miss: #b91c1c;
  --vsa-miss-soft: #fef2f2;
  --vsa-maint: #c2410c;
  --vsa-maint-soft: #fff7ed;
  --vsa-hazard: #991b1b;
  --vsa-hazard-soft: #fee2e2;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 22px;
  --shadow-card: 0 1px 0 rgba(15,23,42,0.04), 0 6px 18px -8px rgba(15,23,42,0.10);
  --shadow-pop: 0 18px 45px -12px rgba(15,23,42,0.18);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--vsa-bg); color: var(--vsa-ink); min-height: 100%; overflow-x: hidden; }
body {
  font-family: 'Inter Tight', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-feature-settings: 'cv11','ss01','ss03';
  -webkit-font-smoothing: antialiased;
  min-width: 320px;
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}
.font-display { font-family: 'Inter Tight', 'Inter', system-ui, sans-serif; letter-spacing: -0.01em; }
.font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

.dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
.dot-good { background: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.18); }
.dot-low  { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.18); }
.dot-miss { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.18); }
.dot-maint{ background: #f97316; box-shadow: 0 0 0 3px rgba(249,115,22,0.18); }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; line-height: 1; }
.pill-good  { background: var(--vsa-good-soft); color: var(--vsa-good); }
.pill-low   { background: var(--vsa-low-soft);  color: var(--vsa-low); }
.pill-miss  { background: var(--vsa-miss-soft); color: var(--vsa-miss); }
.pill-maint { background: var(--vsa-maint-soft);color: var(--vsa-maint); }
.pill-hazard{ background: var(--vsa-hazard-soft);color: var(--vsa-hazard); }
.pill-neutral{ background:#f1f5f9; color:#334155; }
.pill-blue  { background: var(--vsa-blue-soft); color: var(--vsa-blue); }
.pill-teal  { background: var(--vsa-teal-soft); color: var(--vsa-teal); }

.card { background: var(--vsa-surface); border: 1px solid var(--vsa-line); border-radius: var(--r-lg); }
.card-flat { background: var(--vsa-surface); border: 1px solid var(--vsa-line); }
.divider { border-top: 1px solid var(--vsa-line); }

.hazard-stripe { box-shadow: inset 4px 0 0 var(--vsa-hazard); }
.hazard-band { background: linear-gradient(180deg, #fef2f2, #fff); }

.mode-tech-bg { background: linear-gradient(180deg,#fffaeb 0%, #fff 240px); }

.route-principle {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  border: 1px solid #dbeafe;
  background: linear-gradient(135deg, #eff6ff 0%, #ffffff 82%);
  border-radius: 18px;
  padding: 12px;
}
.route-principle-icon {
  width: 38px;
  height: 38px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--vsa-blue);
  color: white;
  flex-shrink: 0;
}
.route-example {
  display: inline-flex;
  max-width: 100%;
  margin-top: 8px;
  padding: 4px 7px;
  border-radius: 8px;
  background: #0b1220;
  color: white;
  font: 600 10.5px/1.35 'JetBrains Mono', ui-monospace, monospace;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.identity-card {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
  border-radius: 10px;
  border: 1px solid #bfdbfe;
  background: #eff6ff;
  padding: 5px 8px;
}
.identity-card span {
  color: #1d4ed8;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .11em;
  text-transform: uppercase;
  white-space: nowrap;
}
.identity-card strong {
  color: #0f172a;
  font: 700 12px/1.1 'JetBrains Mono', ui-monospace, monospace;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.route-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
  border-radius: 999px;
  background: #0f172a;
  color: white;
  padding: 5px 10px;
}
.route-badge span {
  color: #bfdbfe;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.route-badge strong {
  color: white;
  font: 700 11px/1 'JetBrains Mono', ui-monospace, monospace;
}
.update-mode-note {
  border: 1px solid #fde68a;
  background: #fffbeb;
  border-radius: 16px;
  padding: 11px 12px;
}
.hazard-callout {
  border: 1px solid #fecaca;
  background: linear-gradient(135deg, #fef2f2 0%, #fff 100%);
  border-radius: 16px;
  padding: 11px 12px;
  box-shadow: inset 4px 0 0 var(--vsa-hazard);
}
.pilot-gate {
  border-radius: 18px;
  border: 1px solid;
  padding: 13px 14px;
  font-size: 13px;
}
.pilot-gate.is-review {
  border-color: #fcd34d;
  background: #fffbeb;
  color: #78350f;
}
.pilot-gate.is-blocked {
  border-color: #fecaca;
  background: #fef2f2;
  color: #7f1d1d;
}

.qr-glyph {
  background-image:
    linear-gradient(45deg, #0b1220 25%, transparent 25%),
    linear-gradient(-45deg, #0b1220 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #0b1220 75%),
    linear-gradient(-45deg, transparent 75%, #0b1220 75%);
  background-size: 12px 12px;
  background-position: 0 0, 0 6px, 6px -6px, -6px 0;
}

.seg { display: inline-flex; padding: 3px; background:#eef2f6; border-radius: 12px; }
.seg button { padding: 6px 12px; border-radius: 9px; font-size: 13px; font-weight: 600; color:#475569; }
.seg button.is-active { background: white; color: var(--vsa-ink); box-shadow: 0 1px 0 rgba(15,23,42,0.04), 0 4px 12px -4px rgba(15,23,42,0.18); }

.save-bar {
  position: sticky; bottom: 0; left:0; right:0;
  background: linear-gradient(180deg, rgba(255,255,255,0.7), #fff 30%);
  border-top: 1px solid var(--vsa-line);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  display: flex; gap: 10px; align-items: center; justify-content: space-between;
  backdrop-filter: blur(8px);
  z-index: 5;
}

.row-changed { background: #fffbeb; box-shadow: inset 3px 0 0 #f59e0b; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:600; border-radius: 12px; padding: 10px 14px; font-size: 14px; transition: all .12s ease; min-height: 44px; }
.btn-primary { background: var(--vsa-blue); color: white; }
.btn-primary:hover { background: var(--vsa-blue-2); }
.btn-secondary { background: white; color: var(--vsa-ink); border: 1px solid var(--vsa-line); }
.btn-secondary:hover { background: var(--vsa-surface-2); }
.btn-ghost { background: transparent; color: var(--vsa-ink-2); }
.btn-ghost:hover { background: var(--vsa-surface-2); }
.btn-danger { background: var(--vsa-miss); color: white; }
.btn-success { background: var(--vsa-good); color: white; }
.btn-success:hover { background: #065f46; }

.input, .select { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--vsa-line); background: white; font-size: 15px; }
.input:focus, .select:focus { outline: none; border-color: var(--vsa-blue); box-shadow: 0 0 0 3px rgba(29,78,216,0.15); }
.qty-input { font-feature-settings: 'tnum'; font-variant-numeric: tabular-nums; font-weight: 600; text-align: center; font-size: 18px; }

.tap { min-height: 44px; min-width: 44px; }

.room-tab { padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color:#475569; background: white; border: 1px solid var(--vsa-line); white-space: nowrap; }
.room-tab.is-active { background: var(--vsa-ink); color: white; border-color: var(--vsa-ink); }
.room-tab.rollout { border-color: var(--vsa-teal); color: var(--vsa-teal); background: var(--vsa-teal-soft); }
.room-tab.rollout.is-active { background: var(--vsa-teal); color: white; }

.gauge { transform: rotate(-90deg); }
.gauge circle { fill: none; stroke-width: 10; stroke-linecap: round; }

.skel { background: linear-gradient(90deg, #f1f5f9 0%, #e2e8f0 50%, #f1f5f9 100%); background-size: 200% 100%; animation: skel 1.4s infinite; border-radius: 8px; }
@keyframes skel { 0%{background-position: 200% 0;} 100%{background-position: -200% 0;} }

.topbar {
  padding-top: max(8px, env(safe-area-inset-top));
  min-height: calc(48px + env(safe-area-inset-top));
}
.topbar-title { min-width: 0; }

.label-sheet { background: white; border: 1px solid var(--vsa-line); }
.qr-label { border: 1.5px dashed #cbd5e1; padding: 14px; display: flex; gap: 14px; align-items: center; border-radius: 8px; }
.storage-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }

.clamp-2 { display:-webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.no-scrollbar::-webkit-scrollbar { display:none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

/* App-shell adjustments for production (no phone-frame chrome) */
.app-shell { width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--vsa-bg); padding-bottom: env(safe-area-inset-bottom); }
@media (min-width: 1024px) {
  .app-shell.wide { max-width: 1220px; }
  .storage-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .label-sheet { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (min-width: 1280px) {
  .app-shell.wide { max-width: 1320px; }
  .storage-grid { grid-template-columns: repeat(3, minmax(300px, 1fr)); }
}

@media (max-width: 640px) {
  .app-shell.wide { max-width: 480px; }
  .storage-grid { gap: 10px; }
  .input, .select, .qty-input { font-size: 16px; }
  .room-tab { min-height: 40px; padding-inline: 13px; }
  .pill { max-width: 100%; }
  .route-principle { border-radius: 16px; padding: 11px; }
  .route-example { display: flex; width: 100%; white-space: normal; overflow-wrap: anywhere; }
  .identity-card { display: flex; width: fit-content; min-width: 0; }
  .identity-card strong, .route-badge strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  .storage-card-main { gap: 10px; padding: 12px; }
  .storage-card-main h3 { white-space: normal; overflow: visible; text-overflow: clip; }
  .storage-card-count {
    min-width: 56px;
    border-radius: 12px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    padding: 8px 6px;
  }
  .storage-card-actions {
    padding: 8px;
    gap: 8px;
  }
  .storage-card-actions button {
    min-height: 44px;
    border-radius: 12px;
    background: #f8fafc;
  }

  .context-strip {
    padding-inline: 12px;
    padding-top: max(10px, env(safe-area-inset-top));
  }
  .context-strip h1 {
    font-size: 17px;
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
  }
  .storage-mode-toggle {
    min-height: 36px;
    white-space: nowrap;
  }
  .location-filters {
    grid-template-columns: 1fr;
    padding-inline: 12px;
  }

  .update-mode-note > .flex {
    flex-direction: column;
    align-items: stretch;
  }
  .update-mode-note .btn {
    width: 100%;
    min-width: 0;
  }

  .item-card {
    padding: 12px;
  }
  .item-card-row {
    flex-direction: column;
    gap: 12px;
  }
  .item-card-main {
    width: 100%;
  }
  .expected-box {
    width: 100%;
    min-width: 0;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 4px 10px;
    text-align: left;
  }
  .expected-box > div:nth-child(2) {
    grid-row: span 2;
    font-size: 26px;
  }
  .expected-box > div:last-child {
    justify-content: flex-start;
  }
  .item-card-controls {
    width: 100% !important;
    display: grid;
    grid-template-columns: 1fr;
  }
  .item-card-controls .tap {
    min-width: 48px;
  }
  .item-card-controls .select,
  .item-card-controls .qty-input {
    min-height: 46px;
  }
  .item-card-controls [data-action="remove-item"] {
    min-height: 44px;
  }

  .add-item-panel { margin-inline: 12px; }
  .add-item-panel > .flex:first-child {
    flex-direction: column;
  }
  .add-item-panel [data-action="cancel-add-item"] {
    align-self: flex-start;
    min-height: 40px;
  }
  .add-item-grid { grid-template-columns: 1fr !important; }
  .add-item-actions {
    justify-content: stretch;
  }
  .add-item-actions .btn {
    width: 100%;
  }

  .save-bar {
    align-items: stretch;
    flex-direction: column;
    gap: 9px;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    box-shadow: 0 -14px 28px -20px rgba(15,23,42,0.32);
  }
  .save-bar .btn {
    width: 100%;
  }

  .qr-label {
    align-items: flex-start;
    gap: 10px;
    padding: 10px;
  }
  .qr-label > .bg-white {
    width: 74px !important;
    height: 74px !important;
  }
  .qr-label img {
    width: 62px;
    height: 62px;
  }
  .label-sheet {
    padding: 10px !important;
  }

  .storage-master-row {
    padding-inline: 12px;
  }
  .storage-master-row h3 {
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
  }

  .topbar {
    padding-inline: 8px;
  }
  .topbar .btn {
    min-height: 40px;
    padding-inline: 10px;
  }
}

@media (max-width: 420px) {
  .storage-card-main {
    flex-wrap: wrap;
  }
  .storage-card-count {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    text-align: left;
  }
  .qr-label {
    flex-direction: column;
  }
  .qr-label > .bg-white {
    width: 92px !important;
    height: 92px !important;
  }
  .qr-label img {
    width: 78px;
    height: 78px;
  }
}

@media print {
  body, html, .app-shell { background: white; }
  .app-shell { max-width: none; }
  .tap, .btn, [data-action="back"] { display: none !important; }
  .label-sheet { border: 0; }
  .qr-label { break-inside: avoid; page-break-inside: avoid; }
}
</style>
